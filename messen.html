<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة محادثات الماسنجر - Alhwary</title>
    <!-- استدعاء Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- الهيدر العلوي -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">إدارة محادثات الماسنجر (Alhwary)</h1>
        <span class="text-sm bg-blue-700 px-3 py-1 rounded-full flex items-center gap-2">
            <span class="w-2.5 h-2.5 bg-green-400 rounded-full animate-pulse"></span> متصل بـ Firebase
        </span>
    </header>

    <!-- حاوية الشات الرئيسية -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- القائمة الجانبية: قائمة العملاء -->
        <div class="w-1/3 bg-white border-l border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200 font-bold text-gray-700 bg-gray-50">العملاء السابقون</div>
            <div class="overflow-y-auto flex-1 divide-y divide-gray-100" id="clients-list">
                <!-- سيتم تعبئة العملاء هنا ديناميكياً -->
                <div class="p-4 text-gray-400 text-center text-sm">جاري تحميل العملاء...</div>
            </div>
        </div>

        <!-- منطقة المحادثة النشطة -->
        <div class="w-2/3 flex flex-col bg-gray-50">
            <!-- معلومات العميل الحالي -->
            <div class="bg-white p-3 border-b border-gray-200 font-semibold text-gray-700 px-6" id="active-chat-title">
                اختر عميلاً من القائمة لبدء المحادثة
            </div>

            <!-- رسائل الشات -->
            <div class="flex-1 p-4 overflow-y-auto space-y-3" id="chat-messages">
                <div class="text-center text-gray-400 mt-20">لا توجد محادثة محددة</div>
            </div>

            <!-- صندوق كتابة الرد -->
            <div class="p-4 bg-white border-t border-gray-200 flex gap-2">
                <input type="text" id="message-input" placeholder="اكتب ردك هنا..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" disabled>
                <button onclick="sendReply()" id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition font-medium opacity-50 cursor-not-allowed" disabled>إرسال</button>
            </div>
        </div>

    </div>

    <!-- سكربت Firebase والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4iEHiucQPltx4hf_i03sv8NwJPeyisOQ",
            authDomain: "messeng-54eba.firebaseapp.com",
            databaseURL: "https://messeng-54eba-default-rtdb.firebaseio.com",
            projectId: "messeng-54eba",
            storageBucket: "messeng-54eba.firebasestorage.app",
            messagingSenderId: "556434854739",
            appId: "1:556434854739:web:5fc3e479d8c42222d287a6",
            measurementId: "G-FVH4ZFFM6K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentSelectedClient = null;

        const clientsListEl = document.getElementById('clients-list');
        const chatMessagesEl = document.getElementById('chat-messages');
        const activeChatTitleEl = document.getElementById('active-chat-title');
        const messageInputEl = document.getElementById('message-input');
        const sendBtnEl = document.getElementById('send-btn');

        // 1. الاستماع للعملاء الجدد وتعبئة القائمة الجانبية
        const messagesRef = ref(db, 'messages');
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                clientsListEl.innerHTML = '<div class="p-4 text-gray-400 text-center text-sm">لا توجد رسائل بعد</div>';
                return;
            }

            clientsListEl.innerHTML = '';
            Object.keys(data).forEach(senderId => {
                const clientDiv = document.createElement('div');
                clientDiv.className = `p-4 hover:bg-gray-50 cursor-pointer transition flex justify-between items-center ${currentSelectedClient === senderId ? 'bg-blue-50 border-r-4 border-blue-600' : ''}`;
                clientDiv.innerHTML = `
                    <div>
                        <p class="font-semibold text-gray-800 text-sm">عميل: ${senderId}</p>
                        <p class="text-xs text-gray-500 mt-1">انقر لعرض المحادثة</p>
                    </div>
                `;
                clientDiv.onclick = () => selectClient(senderId);
                clientsListEl.appendChild(clientDiv);
            });
        });

        // 2. اختيار عميل لعرض رسائله
        window.selectClient = function(senderId) {
            currentSelectedClient = senderId;
            activeChatTitleEl.innerText = `محادثة مع العميل: ${senderId}`;
            messageInputEl.disabled = false;
            sendBtnEl.disabled = false;
            sendBtnEl.classList.remove('opacity-50', 'cursor-not-allowed');

            // الاستماع لرسائل هذا العميل حصرياً
            const clientMessagesRef = ref(db, `messages/${senderId}`);
            onValue(clientMessagesRef, (snapshot) => {
                const msgs = snapshot.val();
                chatMessagesEl.innerHTML = '';
                if (!msgs) {
                    chatMessagesEl.innerHTML = '<div class="text-center text-gray-400 mt-20">لا توجد رسائل مع هذا العميل</div>';
                    return;
                }

                Object.values(msgs).forEach(msg => {
                    const isOutbound = msg.direction === 'outbound';
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex ${isOutbound ? 'justify-end' : 'justify-start'}`;
                    msgDiv.innerHTML = `
                        <div class="${isOutbound ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border border-gray-200'} p-3 rounded-2xl shadow-sm max-w-xs lg:max-w-md text-sm">
                            ${msg.message}
                        </div>
                    `;
                    chatMessagesEl.appendChild(msgDiv);
                });
                chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            });
        }

        // 3. إرسال رد جديد وتخزينه في Firebase (ليظهر مباشرة)
        window.sendReply = function() {
            const text = messageInputEl.value.trim();
            if (!text || !currentSelectedClient) return;

            const clientMessagesRef = ref(db, `messages/${currentSelectedClient}`);
            const newMsgRef = push(clientMessagesRef);
            set(newMsgRef, {
                sender_id: currentSelectedClient,
                message: text,
                direction: 'outbound',
                timestamp: Date.now()
            });

            messageInputEl.value = '';
        }

        // السماح بالارسال بزر Enter
        messageInputEl.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendReply();
            }
        });
    </script>
</body>
</html>
