<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض صفحة العملاء - شركة الهواري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col h-full">

    <header class="bg-slate-800 shadow-md p-4 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-amber-500">الهواري للتعارف والزواج</h1>
    </header>

    <main class="flex-grow w-full h-full">
        <!-- إضافة sandbox لمنح الإطار صلاحيات تنفيذ النماذج والجافاسكريبت وملفات تعريف الارتباط -->
        <iframe src="https://alhwary.wuaze.com" 
                class="w-full h-full border-none" 
                title="صفحة العملاء"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('ServiceWorker registered successfully with scope:', reg.scope);
                        
                        if ('Notification' in window && Notification.permission !== 'granted') {
                            Notification.requestPermission().then(permission => {
                                if (permission === 'granted') {
                                    console.log('تم منح إذن الإشعارات بنجاح.');
                                } else {
                                    console.log('تم رفض إذن الإشعارات.');
                                }
                            });
                        }
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
