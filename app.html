<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض صفحة العملاء - شركة الهواري</title>
    <!-- استخدام Tailwind CSS للتنسيق العام للصفحة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col min-h-screen">

    <!-- هيدر الصفحة -->
    <header class="bg-slate-800 shadow-md p-4 border-b border-slate-700 text-center">
        <h1 class="text-xl font-bold text-amber-500">الهواري للتعارف والزواج</h1>
    </header>

    <!-- منطقة عرض المحتوى المستورد تلقائياً -->
    <main class="flex-grow w-full p-4" id="content-container">
        <div class="flex items-center justify-center h-full text-slate-400">
            <p>جاري تحميل البيانات...</p>
        </div>
    </main>

    <!-- جافاسكريبت لجلب محتوى الموقع الآخر وعرضه مباشرة -->
    <script>
        fetch('https://alhwary.wuaze.com')
            .then(response => response.text())
            .then(html => {
                document.getElementById('content-container').innerHTML = html;
            })
            .catch(error => {
                document.getElementById('content-container').innerHTML = `
                    <div class="text-center text-red-400 p-8">
                        <p class="font-bold text-lg">عذراً، تعذر جلب المحتوى مباشرة.</p>
                        <p class="text-sm text-slate-400 mt-2">تأكد من إضافة ترويسة السماح (CORS) في ملف الاستضافة الرئيسي الخاص بك.</p>
                    </div>`;
            });
    </script>

</body>
</html>
