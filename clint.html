<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الهواري للتعارف والزواج - محادثة ومكالمة مباشرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="22.jpg" type="image/jpeg">

    <!-- Meta Pixel Code -->

      n.queue=[];t=b.createElement(e);t.async=!0;

    <style>
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background:url(22.jpg); }
      ::-webkit-scrollbar-thumb { background: url(22.jpg); border-radius: 4px; }
      
      .bg-custom-watermark {
        background-image:url(22.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      @keyframes slideDownBounce {
        0% { transform: translate(-50%, -150px); opacity: 0; }
        60% { transform: translate(-50%, 15px); opacity: 1; }
        80% { transform: translate(-50%, -5px); opacity: 1; }
        100% { transform: translate(-50%, 0); opacity: 1; }
      }

      @keyframes slideUpUp {
        0% { transform: translate(-50%, 0); opacity: 1; }
        100% { transform: translate(-50%, -150px); opacity: 0; }
      }

      .banner-show {
        animation: slideDownBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .banner-hide {
        animation: slideUpUp 0.4s ease-in forwards;
      }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-[100dvh] flex flex-col font-sans relative overflow-hidden bg-custom-watermark">

    <!-- رأس المحادثة -->
    <header class="bg-slate-950/80 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10 shrink-0 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="22.jpg" alt="الهواري" class="w-10 h-10 rounded-full object-cover border border-amber-500/50 shadow-md">
                <span id="headerStatusDot" class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full transition-colors"></span>
            </div>
            <div>
                <h3 class="font-bold text-slate-100 text-sm">الهواري للتعارف والزواج</h3>
                <span id="headerStatusText" class="text-xs text-emerald-400 font-medium">خدمة العملاء - متصل الآن</span>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="startCall()" class="w-10 h-10 bg-amber-600/20 hover:bg-amber-600 text-amber-400 hover:text-white rounded-full flex items-center justify-center transition shadow-md" title="بدء مكالمة صوتية">
                <i class="fa-solid fa-phone text-sm"></i>
            </button>
            <span id="clientDisplayHeader" class="text-xs bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300 hidden sm:inline-block"></span>
        </div>
    </header>

    <!-- صندوق عرض الرسائل -->
    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 flex flex-col max-w-4xl w-full mx-auto z-10">
        <div class="text-center text-slate-400 my-auto text-sm bg-slate-950/40 p-6 rounded-2xl border border-slate-800/60 backdrop-blur-sm">
            <img src="22.jpg" alt="Logo" class="w-16 h-16 mx-auto rounded-full object-cover mb-3 border border-amber-500/40 shadow-lg">
            <p class="font-bold text-amber-400 mb-1">أهلاً بك في منصة الهواري للتعارف والزواج</p>
            <p class="text-xs text-slate-400">محادثتك محفوظة ومؤمنة بالكامل</p>
        </div>
    </div>

    <!-- إشعار الرسائل العائم داخل الصفحة -->
    <div id="msgNotificationBanner" class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-950/95 border border-amber-500/50 text-white px-4 py-3 rounded-2xl shadow-2xl z-50 text-xs font-bold opacity-0 pointer-events-none flex items-center gap-3 backdrop-blur-lg max-w-md w-[90%]">
        <img src="22.jpg" alt="Logo" class="w-10 h-10 rounded-full object-cover border-2 border-amber-500 shadow-md shrink-0">
        <div class="flex-1 overflow-hidden">
            <p id="bannerSenderName" class="text-amber-400 font-bold text-xs mb-0.5">الهواري للتعارف والزواج</p>
            <p id="bannerMessageText" class="text-slate-200 font-normal text-xs truncate">لديك رسالة جديدة</p>
        </div>
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping shrink-0"></span>
    </div>

    <!-- شريط الإرسال -->
    <footer class="bg-slate-950/80 border-t border-slate-800 p-3 sm:p-4 z-10 shrink-0 backdrop-blur-md">
        <form id="messageForm" onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex items-center gap-2 sm:gap-3">
            <input id="messageInput" type="text" placeholder="اكتب رسالتك هنا..." 
                   class="flex-1 bg-slate-800/90 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-amber-500 transition" autocomplete="off">
            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-3 rounded-xl text-sm font-semibold transition shrink-0 shadow-md">
                إرسال
            </button>
        </form>
    </footer>

    <!-- نافذة إدخال الاسم (نموذج العملاء المحتملين مثل فيسبوك) -->
    <div id="nameModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
            <div class="flex flex-col items-center text-center mb-4">
                <img src="22.jpg" alt="Logo" class="w-16 h-16 rounded-full object-cover mb-2 border-2 border-amber-500/60 shadow-xl">
                <h3 class="text-lg font-bold text-slate-100 mb-1">الهواري للتعارف والزواج</h3>
                <p class="text-xs text-slate-400">أضف بياناتك لإنشاء حسابك والتواصل الفوري</p>
            </div>
            
            <div id="leadFormSteps" class="space-y-3">
                <!-- الخطوة 1: الاسم -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الاسم الكامل <span class="text-amber-500">*</span></label>
                    <input id="userNameInput" type="text" placeholder="مثال: أحمد محمود" 
                           class="w-full bg-slate-800 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500" autocomplete="off">
                </div>

                <!-- الخطوة 2: رقم الهاتف / الواتساب -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">رقم الهاتف (واتساب) <span class="text-amber-500">*</span></label>
                    <input id="userPhoneInput" type="tel" placeholder="مثال: 01012345678" 
                           class="w-full bg-slate-800 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500" autocomplete="off">
                </div>

                <!-- الخطوة 3: العمر -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">العمر <span class="text-amber-500">*</span></label>
                        <input id="userAgeInput" type="number" placeholder="مثال: 28" min="18" max="80"
                               class="w-full bg-slate-800 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500" autocomplete="off">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">الجنس <span class="text-amber-500">*</span></label>
                        <select id="userGenderInput" class="w-full bg-slate-800 border border-slate-700 text-slate-100 px-3 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500">
                            <option value="ذكر">ذكر</option>
                            <option value="أنثى">أنثى</option>
                        </select>
                    </div>
                </div>

                <!-- الخطوة 4: مكان الإقامة -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">بلد الإقامة والمدينة <span class="text-amber-500">*</span></label>
                    <input id="userLocationInput" type="text" placeholder="مثال: مصر، القاهرة" 
                           class="w-full bg-slate-800 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500" autocomplete="off">
                </div>

                <!-- الخطوة 5: المواصفات المطلوبة باختصار -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">ما الذي تبحث عنه؟ (اختياري)</label>
                    <textarea id="userBioInput" rows="2" placeholder="اكتب باختصار شريك الحياة المناسب..." 
                              class="w-full bg-slate-800 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500 resize-none"></textarea>
                </div>

                <button onclick="saveUserName()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl text-sm font-semibold transition shadow-md mt-2">
                    بدء المراسلة الفورية وحفظ البيانات
                </button>
            </div>
        </div>
    </div>

    <!-- شاشة المكالمات -->
    <div id="callScreen" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex-col items-center justify-between p-8 text-white">
        <div class="flex flex-col items-center mt-12">
            <div class="w-28 h-28 bg-slate-800 rounded-full flex items-center justify-center overflow-hidden mb-4 shadow-xl border-2 border-amber-500 animate-pulse">
                <img src="22.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h2 id="callStatusText" class="text-xl font-bold mb-1">جارِ الاتصال...</h2>
            <p class="text-xs text-slate-400 mt-1" id="callTimer">00:00</p>
        </div>
        
        <div class="flex items-center gap-6 mb-12">
            <button id="muteBtn" onclick="toggleMute()" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition hidden" title="كتم الصوت">
                <i id="muteIcon" class="fa-solid fa-microphone"></i>
            </button>
            
            <button id="answerCallBtn" onclick="answerIncomingCall()" class="w-16 h-16 bg-emerald-600 hover:bg-emerald-700 rounded-full flex items-center justify-center text-xl shadow-lg transition hidden animate-bounce" title="الرد">
                <i class="fa-solid fa-phone"></i>
            </button>

            <button onclick="endCall()" class="w-16 h-16 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-xl shadow-lg transition" title="إنهاء">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
            <button id="speakerBtn" onclick="toggleSpeaker()" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition hidden" title="مكبر الصوت">
                <i id="speakerIcon" class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </div>
    
    <audio id="remoteAudio" autoplay playsinline></audio>
    <audio id="ringAudio" src="ran.mp3" preload="auto" loop></audio>
    <audio id="msgSound" src="mes.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
            authDomain: "marry-55604.firebaseapp.com",
            databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
            projectId: "marry-55604",
            storageBucket: "marry-55604.firebasestorage.app",
            messagingSenderId: "524067560260",
            appId: "1:524067560260:web:adc87a02eadf098d5a5511",
            measurementId: "G-0QW3CXTSM3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messaging = getMessaging(app);

        let currentClientKey = localStorage.getItem('messenger_hawary_key');
        let originalDisplayName = localStorage.getItem('messenger_hawary_name');
        
        let isMuted = false;
        let isSpeakerOn = true;
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let peerConnection = null;
        let localStream = null;
        let incomingOfferData = null; 
        let cachedIceServers = null;

        async function getMeteredIceServers() {
            if (cachedIceServers) return cachedIceServers;
            try {
                const response = await fetch("https://alhwary.metered.live/api/v1/turn/credentials?apiKey=6079dfbbdcf8564255625baf8471629ed765");
                cachedIceServers = await response.json();
                return cachedIceServers;
            } catch (error) {
                console.error("Error fetching Metered TURN credentials:", error);
                return {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                };
            }
        }

        const messagesContainer = document.getElementById("chatMessages");
        const ringAudio = document.getElementById("ringAudio");
        const msgSound = document.getElementById("msgSound");

        let isInitialLoad = true;
        let lastMessageCount = 0;

        function autoEnableSystemFeatures() {
            [ringAudio, msgSound].forEach(audio => {
                if(audio) {
                    audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(e => {});
                }
            });
        }

        ['click', 'touchstart', 'keydown'].forEach(evt => {
            document.addEventListener(evt, autoEnableSystemFeatures, { once: true });
        });

        window.addEventListener('DOMContentLoaded', () => {
            autoEnableSystemFeatures();
            if (currentClientKey && originalDisplayName) {
                document.getElementById("nameModal").classList.add("hidden");
                document.getElementById("clientDisplayHeader").innerText = "العميل: " + originalDisplayName;
                initChatSession(currentClientKey, originalDisplayName);
                listenForIncomingCalls(currentClientKey);
                requestFCMToken(currentClientKey);
                setupUserPresence(currentClientKey);
            } else {
                document.getElementById("nameModal").classList.remove("hidden");
                document.getElementById("nameModal").classList.add("flex");
            }
        });

        function setupUserPresence(clientKey) {
            const userStatusRef = ref(db, `single_chat_room/${clientKey}/status`);
            const userClientRef = ref(db, `single_chat_room/${clientKey}/client_info`);

            set(userStatusRef, "online");
            onDisconnect(userStatusRef).set("offline");

            set(userClientRef, {
                name: originalDisplayName,
                lastSeen: Date.now()
            });
            onDisconnect(userClientRef).update({ lastSeen: Date.now() });

            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "hidden") {
                    set(userStatusRef, "offline");
                } else {
                    set(userStatusRef, "online");
                }
            });

            window.addEventListener("pagehide", () => {
                set(userStatusRef, "offline");
            });
        }

        async function requestFCMToken(clientKey) {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const tokenOptions = { serviceWorkerRegistration: await navigator.serviceWorker.register('./firebase-messaging-sw.js') };
                    const token = await getToken(messaging, tokenOptions);
                    if (token) {
                        await set(ref(db, `single_chat_room/${clientKey}/fcm_token`), token);
                    }
                }
            } catch (error) {
                console.log('FCM Token error:', error);
            }
        }

        onMessage(messaging, (payload) => {
            playMessageAlert(payload.notification?.body || "لديك رسالة جديدة", payload.notification?.title || "الهواري للتعارف والزواج");
        });

        window.saveUserName = function() {
            const inputVal = document.getElementById("userNameInput").value.trim();
            const phoneVal = document.getElementById("userPhoneInput").value.trim();
            const ageVal = document.getElementById("userAgeInput").value.trim();
            const genderVal = document.getElementById("userGenderInput").value.trim();
            const locationVal = document.getElementById("userLocationInput").value.trim();
            const bioVal = document.getElementById("userBioInput").value.trim();

            if (!inputVal) { alert("يرجى كتابة الاسم الكامل للمتابعة"); return; }
            if (!phoneVal) { alert("يرجى كتابة رقم الهاتف للتواصل"); return; }
            if (!ageVal) { alert("يرجى تحديد العمر"); return; }
            if (!locationVal) { alert("يرجى كتابة مكان الإقامة"); return; }
            
            autoEnableSystemFeatures();

            originalDisplayName = inputVal;
            const uniqueId = Math.floor(Math.random() * 900000) + 100000;
            currentClientKey = inputVal.replace(/\s+/g, '_') + '_' + uniqueId;
            
            localStorage.setItem('messenger_hawary_key', currentClientKey);
            localStorage.setItem('messenger_hawary_name', originalDisplayName);

            const clientDetailsRef = ref(db, `single_chat_room/${currentClientKey}/client_info`);
            set(clientDetailsRef, {
                name: originalDisplayName,
                phone: phoneVal,
                age: ageVal,
                gender: genderVal,
                location: locationVal,
                bio: bioVal,
                createdAt: Date.now(),
                lastSeen: Date.now()
            });

            if (typeof fbq === 'function') {
                fbq('track', 'Lead', {
                    content_name: 'Customer Lead Form',
                    status: 'completed'
                });
            }

            document.getElementById("nameModal").classList.add("hidden");
            document.getElementById("clientDisplayHeader").innerText = "العميل: " + originalDisplayName;

            initChatSession(currentClientKey, originalDisplayName);
            listenForIncomingCalls(currentClientKey);
            requestFCMToken(currentClientKey);
            setupUserPresence(currentClientKey);

            const welcomeLeadMsg = `مرحباً، أنا ${originalDisplayName}.\nبياناتي:\n- الهاتف: ${phoneVal}\n- العمر: ${ageVal} (${genderVal})\n- الإقامة: ${locationVal}\n- ما أبحث عنه: ${bioVal || 'غير محدد'}`;
            const roomRef = ref(db, 'single_chat_room/' + currentClientKey);
            push(roomRef, { 
                text: welcomeLeadMsg, 
                sender: originalDisplayName, 
                senderRole: "client", 
                timestamp: Date.now() 
            });
            sendTelegramNotification(originalDisplayName, welcomeLeadMsg);
        };

        function initChatSession(clientKey, displayName) {
            const roomRef = ref(db, 'single_chat_room/' + clientKey);
            onValue(roomRef, (snapshot) => {
                messagesContainer.innerHTML = '';
                let messagesArray = [];
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        if(childSnapshot.key === 'call' || childSnapshot.key === 'fcm_token' || childSnapshot.key === 'status' || childSnapshot.key === 'client_info') return;
                        const msg = childSnapshot.val();
                        if(!msg || !msg.text) return;
                        messagesArray.push(msg);
                    });

                    if (!isInitialLoad && messagesArray.length > lastMessageCount) {
                        const latestMsg = messagesArray[messagesArray.length - 1];
                        const isClientMsg = (latestMsg.sender === displayName || latestMsg.senderRole === 'client');
                        
                        if (!isClientMsg) {
                            playMessageAlert(latestMsg.text, latestMsg.sender || "الهواري للتعارف والزواج");
                        }
                    }

                    messagesArray.forEach((msg) => {
                        const isClientMsg = (msg.sender === displayName || msg.senderRole === 'client');
                        appendMessageToUI(msg.text, msg.sender || displayName, msg.timestamp, isClientMsg);
                    });

                    lastMessageCount = messagesArray.length;
                    isInitialLoad = false;
                } else {
                    messagesContainer.innerHTML = '<div class="text-slate-400 text-center my-auto text-sm bg-slate-950/40 p-4 rounded-xl border border-slate-800"><p>أهلاً بك ' + escapeHtml(displayName) + '، تم فتح شات خاص بك مع الهواري للتعارف والزواج.</p></div>';
                    isInitialLoad = false;
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function playMessageAlert(msgText, senderName) {
            if (msgSound) {
                msgSound.currentTime = 0;
                msgSound.play().catch(e => {});
            }
            showMessengerBanner(senderName, msgText);
        }

        function showMessengerBanner(senderName, msgText) {
            const banner = document.getElementById("msgNotificationBanner");
            document.getElementById("bannerSenderName").innerText = senderName;
            document.getElementById("bannerMessageText").innerText = msgText;

            banner.classList.remove("banner-hide", "opacity-0", "pointer-events-none");
            banner.classList.add("banner-show");

            if (window.bannerTimeout) clearTimeout(window.bannerTimeout);
            window.bannerTimeout = setTimeout(() => {
                banner.classList.remove("banner-show");
                banner.classList.add("banner-hide");
            }, 4000);
        }

        function sendTelegramNotification(clientName, messageText) {
            const botToken = '8090373434:AAHrDcaMsXYG444KTUnXr1RXTEGvBXW_Fw4'; 
            const chatId = '7594072203'; 
            const text = `🔔 عميل محتمل جديد (الهواري للتعارف والزواج)!\n👤 من: ${clientName}\n💬 التفاصيل:\n${messageText}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`;
            fetch(url).catch(error => console.log("Telegram error:", error));
        }

        window.sendMessage = async function(event) {
            event.preventDefault();
            if (!currentClientKey) return;
            const inputField = document.getElementById("messageInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;

            autoEnableSystemFeatures();

            const roomRef = ref(db, 'single_chat_room/' + currentClientKey);
            try {
                await push(roomRef, { 
                    text: messageText, 
                    sender: originalDisplayName, 
                    senderRole: "client", 
                    timestamp: Date.now() 
                });
                
                sendTelegramNotification(originalDisplayName, messageText);
                inputField.value = "";
            } catch (error) { console.error(error); }
        };

        function appendMessageToUI(text, sender, timestamp, isClientMsg) {
            const timeNow = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'الآن';
            let messageHTML = '';
            if (isClientMsg) {
                messageHTML = `<div class="flex flex-col items-end w-full mb-2"><div class="bg-amber-600 text-white p-3 rounded-2xl rounded-tl-none max-w-md text-sm shadow-md"><span class="block text-[10px] text-amber-200 font-bold mb-1">أنت</span>${escapeHtml(text)}<span class="block text-[10px] text-amber-200 mt-1 text-left">${timeNow}</span></div></div>`;
            } else {
                messageHTML = `<div class="flex flex-col items-start w-full mb-2"><div class="bg-slate-800/90 text-slate-100 border border-slate-700 p-3 rounded-2xl rounded-tr-none max-w-md text-sm shadow-md"><span class="block text-[10px] text-amber-400 font-bold mb-1">${escapeHtml(sender)} (الهواري للتعارف والزواج)</span>${escapeHtml(text)}<span class="block text-[10px] text-slate-400 mt-1 text-left">${timeNow}</span></div></div>`;
            }
            messagesContainer.insertAdjacentHTML('beforeend', messageHTML);
        }

        window.startCall = async function() {
            autoEnableSystemFeatures();
            showCallScreen("جارِ الاتصال...", false);
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });
                await createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer({ offerToReceiveAudio: true });
                await peerConnection.setLocalDescription(offer);
                await set(ref(db, `single_chat_room/${currentClientKey}/call`), {
                    offer: { type: offer.type, sdp: offer.sdp },
                    caller: 'client'
                });
            } catch (err) { 
                alert("يرجى السماح بالميكروفون"); 
                closeCallUI(); 
            }
        };

        function listenForIncomingCalls(clientKey) {
            const callRef = ref(db, `single_chat_room/${clientKey}/call`);
            onValue(callRef, async (snapshot) => {
                const data = snapshot.val();
                if (!data) { closeCallUI(); return; }
                
                if (data.caller === 'employee' && !data.answer) {
                    incomingOfferData = data.offer;
                    showCallScreen("مكالمة واردة...", true);
                    if (ringAudio) {
                        ringAudio.currentTime = 0;
                        ringAudio.play().catch(e => { ringAudio.play().catch(err => {}); });
                    }
                }

                if (data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
                    if (ringAudio && !ringAudio.paused) { ringAudio.pause(); ringAudio.currentTime = 0; }
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    startTimer();
                    document.getElementById("callStatusText").innerText = "المكالمة جارية...";
                }
            });
            onValue(ref(db, `single_chat_room/${clientKey}/call/candidates`), (snapshot) => {
                snapshot.forEach((child) => {
                    const cand = child.val();
                    if (peerConnection && cand) peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(e=>{});
                });
            });
        }

        window.answerIncomingCall = async function() {
            autoEnableSystemFeatures();
            if (ringAudio && !ringAudio.paused) { ringAudio.pause(); ringAudio.currentTime = 0; }
            document.getElementById("answerCallBtn").classList.add("hidden");
            document.getElementById("muteBtn").classList.remove("hidden");
            document.getElementById("speakerBtn").classList.remove("hidden");
            document.getElementById("callStatusText").innerText = "جارِ الانضمام...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });
                await createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await set(ref(db, `single_chat_room/${currentClientKey}/call/answer`), {
                    type: answer.type, sdp: answer.sdp
                });

                startTimer();
                document.getElementById("callStatusText").innerText = "المكالمة جارية...";
            } catch (err) {
                alert("يرجى السماح بالميكروفون");
                closeCallUI();
            }
        };

        async function createPeerConnection() {
            if (peerConnection) return;
            const iceServersConfig = await getMeteredIceServers();
            peerConnection = new RTCPeerConnection(iceServersConfig);
            
            // حل مشكلة الصوت: ضمان إلغاء الكتم صراحة وتشغيل العنصر
            peerConnection.ontrack = (event) => { 
                if (ringAudio && !ringAudio.paused) { ringAudio.pause(); ringAudio.currentTime = 0; }
                const remoteAudio = document.getElementById("remoteAudio");
                remoteAudio.muted = false;
                
                if (event.streams && event.streams[0]) {
                    remoteAudio.srcObject = event.streams[0];
                } else {
                    let inboundStream = new MediaStream();
                    inboundStream.addTrack(event.track);
                    remoteAudio.srcObject = inboundStream;
                }
                
                remoteAudio.play().then(() => {
                    console.log("Audio playing successfully");
                }).catch(e => {
                    console.error("Audio play error:", e);
                });
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) push(ref(db, `single_chat_room/${currentClientKey}/call/candidates`), event.candidate.toJSON());
            };
        }

        function showCallScreen(statusText, isIncoming) {
            const callScreen = document.getElementById("callScreen");
            callScreen.classList.remove("hidden");
            callScreen.classList.add("flex");
            document.getElementById("callStatusText").innerText = statusText;
            secondsElapsed = 0;
            document.getElementById("callTimer").innerText = "00:00";

            if (isIncoming) {
                document.getElementById("answerCallBtn").classList.remove("hidden");
                document.getElementById("muteBtn").classList.add("hidden");
                document.getElementById("speakerBtn").classList.add("hidden");
            } else {
                document.getElementById("answerCallBtn").classList.add("hidden");
                document.getElementById("muteBtn").classList.remove("hidden");
                document.getElementById("speakerBtn").classList.remove("hidden");
            }
        }

        function startTimer() {
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById("callTimer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        window.endCall = function() {
            if (ringAudio && !ringAudio.paused) { ringAudio.pause(); ringAudio.currentTime = 0; }
            if (currentClientKey) remove(ref(db, `single_chat_room/${currentClientKey}/call`));
            closeCallUI();
        };

        function closeCallUI() {
            if (ringAudio && !ringAudio.paused) { ringAudio.pause(); ringAudio.currentTime = 0; }
            const callScreen = document.getElementById("callScreen");
            callScreen.classList.remove("flex"); callScreen.classList.add("hidden");
            if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
        }

        window.toggleMute = function() {
            isMuted = !isMuted;
            if (localStream && localStream.getAudioTracks()[0]) localStream.getAudioTracks()[0].enabled = !isMuted;
            const muteBtn = document.getElementById("muteBtn");
            const muteIcon = document.getElementById("muteIcon");
            if (isMuted) {
                muteBtn.className = "w-14 h-14 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                muteIcon.className = "fa-solid fa-microphone-slash";
            } else {
                muteBtn.className = "w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                muteIcon.className = "fa-solid fa-microphone";
            }
        };

        window.toggleSpeaker = function() {
            isSpeakerOn = !isSpeakerOn;
            document.getElementById("remoteAudio").muted = !isSpeakerOn;
            const speakerBtn = document.getElementById("speakerBtn");
            const speakerIcon = document.getElementById("speakerIcon");
            if (isSpeakerOn) {
                speakerBtn.className = "w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                speakerIcon.className = "fa-solid fa-volume-high";
            } else {
                speakerBtn.className = "w-14 h-14 bg-amber-600 hover:bg-amber-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                speakerIcon.className = "fa-solid fa-volume-xmark";
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
