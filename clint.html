<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تليجرام - دردشة العملاء</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
  <link rel="icon" href="22.jpg" type="image/jpeg">
  <style>
   ::-webkit-scrollbar { width: 4px; }
   ::-webkit-scrollbar-track { background: #0e1621; }
   ::-webkit-scrollbar-thumb { background: #232e3c; border-radius: 4px; }
   .telegram-bg { background-color: #0e1621; }
  </style>
</head>
<body class="bg-[#0e1621] text-white font-sans h-[100dvh] overflow-hidden telegram-bg">

  <div class="flex flex-col h-full w-full relative overflow-hidden">
    
    <header class="h-14 border-b border-[#232e3c] px-4 flex items-center justify-between bg-[#17212b] z-20">
      <div class="flex items-center space-x-3 space-x-reverse min-w-0">
        <div class="relative">
          <img src="22.jpg" class="w-9 h-9 rounded-full object-cover">
          <span class="absolute bottom-0 left-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-[#17212b] rounded-full"></span>
        </div>
        <div class="min-w-0">
          <h3 id="clientHeaderName" class="text-xs font-bold text-white truncate">أهلاً بك، زائرنا الكريم</h3>
          <span class="text-[10px] text-emerald-400 block">متصل بالدعم الفني</span>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="clientCallBtn" onclick="clientStartCall()" class="w-9 h-9 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center justify-center transition" title="اتصال صوتي بالمشرف">
          <i class="fa-solid fa-phone text-xs"></i>
        </button>
      </div>
    </header>

    <div id="messageContainer" class="flex-1 p-4 overflow-y-auto flex flex-col space-y-2 text-sm bg-[#0e1621]">
      <div class="text-center text-[#8796a5] my-auto bg-[#17212b] p-4 rounded-xl border border-[#232e3c] max-w-sm mx-auto text-xs">جاري تحميل المحادثة...</div>
    </div>

    <div class="p-3 border-t border-[#232e3c] bg-[#17212b] z-20">
      <form id="messageForm" class="flex items-center space-x-2 space-x-reverse" onsubmit="sendMessage(event)">
        <input type="text" id="messageInput" placeholder="اكتب رسالتك للموظف..." autocomplete="off" class="flex-1 bg-[#212f3d] border border-transparent text-white rounded-full px-4 py-2.5 text-xs focus:outline-none">
        <button type="submit" class="bg-[#2b5278] hover:bg-[#386d9d] text-white px-5 py-2.5 rounded-full text-xs font-semibold transition">إرسال</button>
      </form>
    </div>

  </div>

  <div id="clientIncomingCallModal" class="fixed inset-0 bg-[#0e1621]/90 z-50 hidden flex-col items-center justify-center p-4">
    <div class="bg-[#17212b] border border-[#232e3c] p-6 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full text-center">
      <div class="w-20 h-20 bg-[#2b5278]/30 text-[#6ab2f2] rounded-full flex items-center justify-center mb-4 border-2 border-[#2b5278] animate-bounce">
        <img src="22.jpg" class="w-full h-full rounded-full object-cover">
      </div>
      <h3 class="text-sm font-bold mb-1">الموظف يتصل بك!</h3>
      <p class="text-xs text-emerald-400 mb-5">مكالمة صوتية واردة من الدعم الفني...</p>
      <div class="flex items-center gap-3 w-full">
        <button onclick="clientRejectCall()" class="flex-1 bg-red-600 hover:bg-red-700 py-2.5 rounded-xl font-semibold text-xs">رفض</button>
        <button onclick="clientAcceptCall()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-2.5 rounded-xl font-semibold text-xs">رد</button>
      </div>
    </div>
  </div>

  <div id="clientCallScreen" class="fixed inset-0 bg-[#0e1621]/95 z-50 hidden flex-col items-center justify-between p-8 text-white">
    <div class="flex flex-col items-center mt-12">
      <div class="w-24 h-24 bg-[#17212b] rounded-full flex items-center justify-center overflow-hidden mb-4 border-2 border-emerald-500 animate-pulse">
        <img src="22.jpg" class="w-full h-full object-cover">
      </div>
      <h2 class="text-lg font-bold mb-1">المكالمة جارية مع الدعم الفني</h2>
      <p class="text-xs text-[#8796a5]" id="clientCallTimer">00:00</p>
    </div>
    
    <div class="flex items-center gap-6 mb-12">
      <button onclick="clientToggleMute()" class="w-14 h-14 bg-[#17212b] hover:bg-[#232e3c] rounded-full flex items-center justify-center text-lg transition border border-[#232e3c]">
        <i class="fa-solid fa-microphone" id="clientMuteIcon"></i>
      </button>
      <button onclick="clientEndCall()" class="w-16 h-16 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-xl transition">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

  <audio id="clientRingAudio" src="ran.mp3" preload="auto" loop></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
        authDomain: "marry-55604.firebaseapp.com",
        databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
        projectId: "marry-55604",
        storageBucket: "marry-55604.firebasestorage.app",
        messagingSenderId: "524067560260",
        appId: "1:524067560260:web:adc87a02eadf098d5a5511"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let clientName = localStorage.getItem('clientName') || "العميل_" + Math.floor(Math.random() * 1000);
    localStorage.setItem('clientName', clientName);
    const roomKey = clientName.replace(/\s+/g, '_');

    let callFrame = null, clientTimerInterval = null, clientSeconds = 0;
    let isClientCallActiveOrRinging = false, activeCallRoomUrl = null, isMuted = false;

    document.getElementById('clientHeaderName').innerText = clientName;

    window.addEventListener('DOMContentLoaded', () => {
      const statusRef = ref(db, `single_chat_room/${roomKey}/status`);
      set(statusRef, 'online');
      onDisconnect(statusRef).set('offline');

      onValue(ref(db, `single_chat_room/${roomKey}`), (snapshot) => {
        const container = document.getElementById('messageContainer');
        container.innerHTML = '';
        if (snapshot.exists()) {
          snapshot.forEach((child) => {
            if(child.key === 'call') { checkIncomingCall(child.val()); return; }
            if(['assignedStatus','status','lockedBy','assignedTo'].includes(child.key)) return;
            const msg = child.val();
            if(msg && msg.text) {
              const isClient = (msg.senderRole === 'client' || msg.sender === clientName);
              appendMessageToUI(msg.text, msg.sender || 'موظف', msg.timestamp, isClient);
            }
          });
        } else {
          container.innerHTML = '<div class="text-center text-[#8796a5] my-auto text-xs">ابدأ بإرسال رسالة للدعم الفني</div>';
        }
      });
    });

    window.sendMessage = async function(event) {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if(!text) return;

      await push(ref(db, `single_chat_room/${roomKey}`), {
        text,
        sender: clientName,
        senderRole: "client",
        timestamp: Date.now()
      });
      input.value = '';
    };

    function checkIncomingCall(callData) {
      if (callData && callData.type === 'offer' && callData.sender === 'employee' && !isClientCallActiveOrRinging) {
        isClientCallActiveOrRinging = true;
        activeCallRoomUrl = callData.roomUrl;
        document.getElementById("clientIncomingCallModal").style.display = "flex";
        document.getElementById("clientRingAudio").play().catch(e => {});
      } else if (!callData && isClientCallActiveOrRinging) {
        clientEndCall();
      }
    }

    window.clientAcceptCall = async function() {
      document.getElementById("clientRingAudio").pause();
      document.getElementById("clientIncomingCallModal").style.display = "none";
      showClientCallScreen();

      try {
        if (!activeCallRoomUrl) {
          alert("رابط المكالمة غير متوفر");
          clientEndCall();
          return;
        }

        callFrame = DailyIframe.createCallObject({ audioSource: true, videoSource: false });
        await callFrame.join({ url: activeCallRoomUrl });
        startClientTimer();
      } catch(e) {
        console.error("Daily join error:", e);
        alert("تعذر الانضمام للمكالمة");
        clientEndCall();
      }
    };

    window.clientStartCall = async function() {
      if (isClientCallActiveOrRinging) return;
      isClientCallActiveOrRinging = true;
      showClientCallScreen();

      try {
        activeCallRoomUrl = "https://alhwarychate.daily.co/support-room";

        await set(ref(db, `single_chat_room/${roomKey}/call`), {
          roomUrl: activeCallRoomUrl,
          type: 'offer',
          sender: 'client'
        });

        callFrame = DailyIframe.createCallObject({ audioSource: true, videoSource: false });
        await callFrame.join({ url: activeCallRoomUrl });
        startClientTimer();
      } catch(e) {
        console.error("Daily start error:", e);
        alert("تعذر بدء الاتصال");
        clientEndCall();
      }
    };

    function showClientCallScreen() {
      document.getElementById("clientCallScreen").classList.remove("hidden");
      document.getElementById("clientCallScreen").classList.add("flex");
      clientSeconds = 0;
    }

    function startClientTimer() {
      if (clientTimerInterval) clearInterval(clientTimerInterval);
      clientTimerInterval = setInterval(() => {
        clientSeconds++;
        document.getElementById("clientCallTimer").innerText = `${Math.floor(clientSeconds/60).toString().padStart(2,'0')}:${(clientSeconds%60).toString().padStart(2,'0')}`;
      }, 1000);
    }

    window.clientEndCall = async function() {
      try {
        if (callFrame) { await callFrame.leave(); callFrame.destroy(); callFrame = null; }
        await remove(ref(db, `single_chat_room/${roomKey}/call`));
      } catch(e) { console.error("End call error:", e); }
      closeClientCallUI();
    };

    function closeClientCallUI() {
      isClientCallActiveOrRinging = false;
      const ringAudio = document.getElementById("clientRingAudio");
      if (ringAudio) ringAudio.pause();

      const callScreen = document.getElementById("clientCallScreen");
      if (callScreen) {
        callScreen.classList.remove("flex");
        callScreen.classList.add("hidden");
      }

      const incomingModal = document.getElementById("clientIncomingCallModal");
      if (incomingModal) incomingModal.style.display = "none";

      if (clientTimerInterval) clearInterval(clientTimerInterval);
    }

    window.clientRejectCall = function() {
      const ringAudio = document.getElementById("clientRingAudio");
      if (ringAudio) ringAudio.pause();
      document.getElementById("clientIncomingCallModal").style.display = "none";
      remove(ref(db, `single_chat_room/${roomKey}/call`));
      isClientCallActiveOrRinging = false;
    };

    window.clientToggleMute = function() {
      if (!callFrame) return;
      isMuted = !isMuted;
      callFrame.setLocalAudio(!isMuted);
      document.getElementById("clientMuteIcon").className = isMuted ? "fa-solid fa-microphone-slash text-red-400" : "fa-solid fa-microphone";
    };

    function appendMessageToUI(text, sender, timestamp, isClientMsg) {
      const container = document.getElementById('messageContainer');
      const time = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'الآن';
      const html = isClientMsg 
        ? `<div class="flex flex-col items-end w-full mb-1"><div class="bg-[#2b5278] text-white p-2.5 px-3.5 rounded-2xl rounded-tl-none max-w-md text-xs shadow"><span class="block text-[9px] text-[#8796a5] font-bold mb-0.5">${sender} (أنت)</span><span>${escapeHtml(text)}</span><span class="block text-[9px] text-[#8796a5] mt-1 text-left">${time}</span></div></div>`
        : `<div class="flex flex-col items-start w-full mb-1"><div class="bg-[#182533] text-white p-2.5 px-3.5 rounded-2xl rounded-tr-none max-w-md text-xs shadow border border-[#232e3c]"><span class="block text-[9px] text-[#6ab2f2] font-bold mb-0.5">${sender} (موظف الدعم)</span><span>${escapeHtml(text)}</span><span class="block text-[9px] text-[#8796a5] mt-1 text-left">${time}</span></div></div>`;
      container.insertAdjacentHTML('beforeend', html);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      return str ? str.toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : '';
    }
  </script>
</body>
</html>
