<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - الدعم الفني Firebase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #e9ebee; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .name-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .name-box {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .name-box h3 { margin-bottom: 15px; color: #050505; font-size: 18px; }
        .name-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ccd0d5;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
        }
        .name-box input:focus { border-color: #0084ff; }
        .name-box button {
            background: #0084ff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        .client-chat-container { width: 380px; height: 550px; background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; }
        .chat-header { background: #0084ff; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .support-info { display: flex; align-items: center; }
        .support-info img { width: 40px; height: 40px; border-radius: 50%; margin-left: 10px; border: 2px solid #fff; object-fit: cover; }
        .support-info h3 { font-size: 15px; }
        .status { font-size: 12px; color: #e4e6eb; }
        .close-btn { font-size: 18px; cursor: pointer; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f4f5f7; display: flex; flex-direction: column; gap: 8px; }
        .msg-time-header { text-align: center; font-size: 11px; color: #8a8d91; margin: 5px 0; }
        
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }
        .message-wrapper.client {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-wrapper.support {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            word-break: break-word;
        }
        .message.support { background: #fff; color: #050505; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.client { background: #0084ff; color: #fff; }

        .msg-timestamp {
            font-size: 10px;
            color: #8a8d91;
            margin-top: 3px;
            padding: 0 4px;
        }

        .chat-footer { padding: 12px; background: #fff; border-top: 1px solid #e4e6eb; display: flex; gap: 10px; align-items: center; }
        .chat-footer input { flex: 1; padding: 10px 15px; border: 1px solid #ccd0d5; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-footer input:focus { border-color: #0084ff; }
        .chat-footer button { background: #0084ff; color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        /* جعل الشات يتجاوب بشكل كامل ليملأ الشاشة على الهواتف المحمولة */
        @media (max-width: 480px) {
            body { background-color: #fff; height: 100vh; align-items: stretch; }
            .client-chat-container { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
<body>

    <audio id="msgSound" src="mes.mp3" preload="auto"></audio>

    <div class="name-modal" id="nameModal">
        <div class="name-box">
            <h3>أدخل اسمك للبدء</h3>
            <input type="text" id="clientNameInput" placeholder="اكتب اسمك هنا...">
            <button onclick="startChat()">بدء المحادثة</button>
        </div>
    </div>

    <div class="client-chat-container" id="chatContainer">
        <div class="chat-header">
            <div class="support-info">
                <img src="22.jpg" alt="Support">
                <div>
                    <h3>خدمة العملاء</h3>
                    <span class="status" id="welcomeUserTitle">متصل الآن</span>
                </div>
            </div>
            <i class="fa-solid fa-xmark close-btn"></i>
        </div>

        <div class="chat-body" id="clientMessages">
            <div class="msg-time-header">اليوم</div>
            <div class="message-wrapper support">
                <div class="message support">
                    <p>مرحباً بك! كيف يمكننا مساعدتك اليوم؟</p>
                </div>
                <span class="msg-timestamp">الآن</span>
            </div>
        </div>

        <div class="chat-footer">
            <input type="text" id="clientInput" placeholder="اكتب رسالتك هنا...">
            <button onclick="sendClientMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
            authDomain: "marry-55604.firebaseapp.com",
            databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
            projectId: "marry-55604",
            storageBucket: "marry-55604.firebasestorage.app",
            messagingSenderId: "524067560260",
            appId: "1:524067560260:web:adc87a02eadf098d5a5511",
            measurementId: "G-0QW3CXTSM3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'chats/');

        const chatBody = document.getElementById('clientMessages');
        const msgSound = document.getElementById('msgSound');

        // معلومات بوت تلجرام
        const TELEGRAM_BOT_TOKEN = "8090373434:AAHrDcaMsXYG444KTUnXr1RXTEGvBXW_Fw4";
        const TELEGRAM_CHAT_ID = "7594072203";

        function sendTelegramNotification(clientName, messageText) {
            const text = `🔔 رسالة جديدة من العميل:\n👤 الاسم: ${clientName}\n💬 النص: ${messageText}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text
                })
            }).catch(err => console.log("Telegram Error:", err));
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker Failed:', err));
            });
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        }

        function playMessageSound() {
            if (msgSound) {
                msgSound.pause();
                msgSound.currentTime = 0;
                msgSound.play().catch(e => {
                    console.log("Audio Play Error:", e);
                });
            }
        }

        window.onload = function() {
            const savedName = sessionStorage.getItem('chatClientName');
            if (savedName) {
                document.getElementById('nameModal').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
                document.getElementById('welcomeUserTitle').innerText = 'أهلاً بك، ' + savedName;
                requestNotificationPermission();
            }
        };

        window.startChat = function() {
            const nameInput = document.getElementById('clientNameInput').value.trim();
            if (nameInput === "") {
                alert("الرجاء كتابة اسمك أولاً");
                return;
            }

            sessionStorage.setItem('chatClientName', nameInput);
            document.getElementById('nameModal').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            document.getElementById('welcomeUserTitle').innerText = 'أهلاً بك، ' + nameInput;
            
            requestNotificationPermission();

            if (msgSound) {
                msgSound.volume = 0;
                msgSound.play().then(() => {
                    msgSound.pause();
                    msgSound.volume = 1;
                }).catch(() => {});
            }
        };

        function formatTime(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        let isInitialLoad = true;
        setTimeout(() => { isInitialLoad = false; }, 1500);

        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const currentClientName = sessionStorage.getItem('chatClientName');
            
            if (data.clientName && currentClientName && data.clientName !== currentClientName) {
                return;
            }

            const wrapperDiv = document.createElement('div');
            wrapperDiv.classList.add('message-wrapper');
            
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');

            const timeSpan = document.createElement('span');
            timeSpan.classList.add('msg-timestamp');

            const messageDate = new Date(data.timestamp || Date.now());
            timeSpan.innerText = formatTime(messageDate);

            if (data.sender === 'client') {
                wrapperDiv.classList.add('client');
                msgDiv.classList.add('client');
                msgDiv.innerHTML = `<p>${data.text}</p>`;
            } else {
                wrapperDiv.classList.add('support');
                msgDiv.classList.add('support');
                msgDiv.innerHTML = `<p>${data.text}</p>`;
                
                if (!isInitialLoad) {
                    playMessageSound();

                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('رسالة جديدة من خدمة العملاء', {
                            body: data.text,
                            icon: './22.jpg'
                        });
                    }
                }
            }

            wrapperDiv.appendChild(msgDiv);
            wrapperDiv.appendChild(timeSpan);
            chatBody.appendChild(wrapperDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        });

        window.sendClientMessage = function() {
            const input = document.getElementById('clientInput');
            const text = input.value.trim();
            const clientName = sessionStorage.getItem('chatClientName') || 'زائر';

            if (text === "") return;

            const now = new Date();

            push(messagesRef, {
                sender: 'client',
                clientName: clientName,
                text: text,
                timestamp: now.getTime(),
                dateString: now.toLocaleDateString('ar-EG'),
                timeString: formatTime(now)
            });

            sendTelegramNotification(clientName, text);

            input.value = "";
        };

        document.getElementById('clientInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendClientMessage();
        });
    </script>
</body>
</html>
