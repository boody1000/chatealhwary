<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محادثة ومكالمة مباشرة الهواري للتعارف والزواج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background:url(22.jpg) }
      ::-webkit-scrollbar-thumb { background: url(22.jpg); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: url(22.jpg); }

      .bg-custom-watermark {
        background-image:url(22.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-[100dvh] flex flex-col font-sans relative overflow-hidden bg-custom-watermark">

    <!-- رأس المحادثة -->
    <header class="bg-slate-950/80 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10 shrink-0 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="22.jpg" alt="شركة الهواري" class="w-10 h-10 rounded-full object-cover border border-amber-500/50 shadow-md">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div>
                <h3 class="font-bold text-slate-100 text-sm"> الهواري للتعارف والزواج</h3>
                <span class="text-xs text-emerald-400 font-medium">خدمة العملاء - متصل الآن</span>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="startCall()" class="w-10 h-10 bg-amber-600/20 hover:bg-amber-600 text-amber-400 hover:text-white rounded-full flex items-center justify-center transition shadow-md" title="بدء مكالمة صوتية">
                <i class="fa-solid fa-phone text-sm"></i>
            </button>
            <span id="clientDisplayHeader" class="text-xs bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300 hidden sm:inline-block"></span>
        </div>
    </header>

    <!-- صندوق عرض الرسائل -->
    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 flex flex-col max-w-4xl w-full mx-auto z-10">
        <div class="text-center text-slate-400 my-auto text-sm bg-slate-950/40 p-6 rounded-2xl border border-slate-800/60 backdrop-blur-sm">
            <img src="22.jpg" alt="Logo" class="w-16 h-16 mx-auto rounded-full object-cover mb-3 border border-amber-500/40 shadow-lg">
            <p class="font-bold text-amber-400 mb-1">أهلاً بك في الهواري للأصالة والعراقة</p>
            <p class="text-xs text-slate-400">محادثتك محفوظة ومؤمنة بالكامل كالمراسلة الفورية</p>
        </div>
    </div>

    <!-- إشعار الرسائل الجديدة العائم داخل الصفحة -->
    <div id="msgNotificationBanner" class="fixed top-20 left-1/2 -translate-x-1/2 bg-amber-600 text-white px-4 py-2 rounded-xl shadow-xl z-50 text-xs font-bold transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2 backdrop-blur-md">
        <i class="fa-solid fa-bell"></i>
        <span>لديك رسالة جديدة من خدمة العملاء</span>
    </div>

    <!-- شريط الإرسال -->
    <footer class="bg-slate-950/80 border-t border-slate-800 p-3 sm:p-4 z-10 shrink-0 backdrop-blur-md">
        <form id="messageForm" onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex items-center gap-2 sm:gap-3">
            <input id="messageInput" type="text" placeholder="اكتب رسالتك هنا..." 
                   class="flex-1 bg-slate-800/90 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-amber-500 transition" autocomplete="off">
            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-3 rounded-xl text-sm font-semibold transition shrink-0 shadow-md">
                إرسال
            </button>
        </form>
    </footer>

    <!-- نافذة إدخال الاسم -->
    <div id="nameModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl flex flex-col items-center text-center">
            <img src="22.jpg" alt="Logo" class="w-20 h-20 rounded-full object-cover mb-3 border-2 border-amber-500/60 shadow-xl">
            <h3 class="text-lg font-bold text-slate-100 mb-1">الهواري للتعارف والزواج</h3>
            <p class="text-xs text-slate-400 mb-4">أدخل اسمك لمرة واحدة لفتح شات خاص بك ومتابعة المحادثة في أي وقت</p>
            
            <input id="userNameInput" type="text" placeholder="مثال: أحمد محمود" 
                   class="w-full bg-slate-800 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-amber-500 mb-4 text-center" autocomplete="off">
            
            <button onclick="saveUserName()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl text-sm font-semibold transition shadow-md">
                بدء المراسلة الفورية
            </button>
        </div>
    </div>

    <!-- شاشة المكالمات الصوتية -->
    <div id="callScreen" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex-col items-center justify-between p-8 text-white">
        <div class="flex flex-col items-center mt-12">
            <div class="w-28 h-28 bg-slate-800 rounded-full flex items-center justify-center overflow-hidden mb-4 shadow-xl border-2 border-amber-500 animate-pulse">
                <img src="22.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h2 id="callStatusText" class="text-xl font-bold mb-1">جارِ الاتصال الهواري...</h2>
            <p class="text-xs text-slate-400 mt-1" id="callTimer">00:00</p>
        </div>
        
        <div class="flex items-center gap-6 mb-12">
            <button id="muteBtn" onclick="toggleMute()" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition hidden" title="كتم الصوت">
                <i id="muteIcon" class="fa-solid fa-microphone"></i>
            </button>
            
            <button id="answerCallBtn" onclick="answerIncomingCall()" class="w-16 h-16 bg-emerald-600 hover:bg-emerald-700 rounded-full flex items-center justify-center text-xl shadow-lg transition hidden animate-bounce" title="الرد على المكالمة">
                <i class="fa-solid fa-phone"></i>
            </button>

            <button onclick="endCall()" class="w-16 h-16 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-xl shadow-lg transition" title="إنهاء المكالمة">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
            <button id="speakerBtn" onclick="toggleSpeaker()" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition hidden" title="مكبر الصوت">
                <i id="speakerIcon" class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </div>
    
    <audio id="remoteAudio" autoplay playsinline></audio>
    <audio id="ringAudio" src="ran.mp3" preload="auto" loop></audio>
    <audio id="msgSound" src="mes.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
            authDomain: "marry-55604.firebaseapp.com",
            databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
            projectId: "marry-55604",
            storageBucket: "marry-55604.firebasestorage.app",
            messagingSenderId: "524067560260",
            appId: "1:524067560260:web:adc87a02eadf098d5a5511",
            measurementId: "G-0QW3CXTSM3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentClientKey = localStorage.getItem('messenger_hawary_key');
        let originalDisplayName = localStorage.getItem('messenger_hawary_name');
        
        let isMuted = false;
        let isSpeakerOn = true;
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let peerConnection = null;
        let localStream = null;
        let incomingOfferData = null; 
        const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const messagesContainer = document.getElementById("chatMessages");
        const ringAudio = document.getElementById("ringAudio");
        const msgSound = document.getElementById("msgSound");

        let isInitialLoad = true;
        let lastMessageCount = 0;

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission().then(permission => {
                    console.log("Notification permission:", permission);
                });
            }
        }

        function unlockAudioContext() {
            [ringAudio, msgSound].forEach(audio => {
                if(audio) {
                    audio.play().then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                    }).catch(e => {});
                }
            });
        }

        ['touchstart', 'click', 'keydown'].forEach(evt => {
            document.addEventListener(evt, () => {
                unlockAudioContext();
                requestNotificationPermission();
            }, { once: true });
        });

        window.addEventListener('DOMContentLoaded', () => {
            requestNotificationPermission();
            if (currentClientKey && originalDisplayName) {
                document.getElementById("nameModal").classList.add("hidden");
                document.getElementById("clientDisplayHeader").innerText = "العميل: " + originalDisplayName;
                initChatSession(currentClientKey, originalDisplayName);
                listenForIncomingCalls(currentClientKey);
            } else {
                document.getElementById("nameModal").classList.remove("hidden");
                document.getElementById("nameModal").classList.add("flex");
            }
        });

        window.saveUserName = function() {
            const inputVal = document.getElementById("userNameInput").value.trim();
            if (!inputVal) { alert("يرجى كتابة اسمك للمتابعة"); return; }
            
            unlockAudioContext();
            requestNotificationPermission();

            originalDisplayName = inputVal;
            const uniqueId = Math.floor(Math.random() * 900000) + 100000;
            currentClientKey = inputVal.replace(/\s+/g, '_') + '_' + uniqueId;
            
            localStorage.setItem('messenger_hawary_key', currentClientKey);
            localStorage.setItem('messenger_hawary_name', originalDisplayName);

            document.getElementById("nameModal").classList.add("hidden");
            document.getElementById("clientDisplayHeader").innerText = "العميل: " + originalDisplayName;

            initChatSession(currentClientKey, originalDisplayName);
            listenForIncomingCalls(currentClientKey);
        };

        function initChatSession(clientKey, displayName) {
            const roomRef = ref(db, 'single_chat_room/' + clientKey);
            onValue(roomRef, (snapshot) => {
                messagesContainer.innerHTML = '';
                let messagesArray = [];
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        if(childSnapshot.key === 'call') return;
                        const msg = childSnapshot.val();
                        if(!msg || !msg.text) return;
                        messagesArray.push(msg);
                    });

                    if (!isInitialLoad && messagesArray.length > lastMessageCount) {
                        const latestMsg = messagesArray[messagesArray.length - 1];
                        const isClientMsg = (latestMsg.sender === displayName || latestMsg.senderRole === 'client');
                        
                        if (!isClientMsg) {
                            playMessageAlert(latestMsg.text, latestMsg.sender || "خدمة العملاء");
                        }
                    }

                    messagesArray.forEach((msg) => {
                        const isClientMsg = (msg.sender === displayName || msg.senderRole === 'client');
                        appendMessageToUI(msg.text, msg.sender || displayName, msg.timestamp, isClientMsg);
                    });

                    lastMessageCount = messagesArray.length;
                    isInitialLoad = false;
                } else {
                    messagesContainer.innerHTML = '<div class="text-slate-400 text-center my-auto text-sm bg-slate-950/40 p-4 rounded-xl border border-slate-800"><p>أهلاً بك ' + escapeHtml(displayName) + '، تم فتح شات خاص بك. يمكنك إرسال رسالتك الآن وسيرد عليك ممثل الدعم.</p></div>';
                    isInitialLoad = false;
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function playMessageAlert(msgText, senderName) {
            // تشغيل صوت الرسائل بغض النظر عن حالة المحادثة
            if (msgSound) {
                msgSound.currentTime = 0;
                msgSound.play().catch(e => {
                    unlockAudioContext();
                    msgSound.play().catch(err => {});
                });
            }
            
            showNotificationBanner();

            // إرسال الإشعار الخارجي ليعمل حتى وإن كانت المحادثة بالخلفية
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    const notification = new Notification(`رسالة جديدة من ${senderName}`, {
                        body: msgText,
                        icon: '22.jpg',
                        tag: 'hawary-msg-notif'
                    });
                    
                    // تشغيل الصوت احتياطياً مع كائن الإشعار لضمان سماعه في الهواتف المغلقة تماماً
                    if (msgSound) {
                        msgSound.currentTime = 0;
                        msgSound.play().catch(e => {});
                    }

                    notification.onclick = function() {
                        window.focus();
                        notification.close();
                    };
                } catch (err) {}
            }
        }

        function showNotificationBanner() {
            const banner = document.getElementById("msgNotificationBanner");
            banner.classList.remove("opacity-0", "pointer-events-none");
            banner.classList.add("opacity-100");
            setTimeout(() => {
                banner.classList.remove("opacity-100");
                banner.classList.add("opacity-0", "pointer-events-none");
            }, 3500);
        }

        window.sendMessage = async function(event) {
            event.preventDefault();
            if (!currentClientKey) return;
            const inputField = document.getElementById("messageInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;

            unlockAudioContext();

            const roomRef = ref(db, 'single_chat_room/' + currentClientKey);
            try {
                await push(roomRef, { 
                    text: messageText, 
                    sender: originalDisplayName, 
                    senderRole: "client", 
                    timestamp: Date.now() 
                });
                inputField.value = "";
            } catch (error) { console.error(error); }
        };

        function appendMessageToUI(text, sender, timestamp, isClientMsg) {
            const timeNow = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'الآن';
            let messageHTML = '';
            if (isClientMsg) {
                messageHTML = `<div class="flex flex-col items-end w-full mb-2"><div class="bg-amber-600 text-white p-3 rounded-2xl rounded-tl-none max-w-md text-sm shadow-md"><span class="block text-[10px] text-amber-200 font-bold mb-1">أنت</span>${escapeHtml(text)}<span class="block text-[10px] text-amber-200 mt-1 text-left">${timeNow}</span></div></div>`;
            } else {
                messageHTML = `<div class="flex flex-col items-start w-full mb-2"><div class="bg-slate-800/90 text-slate-100 border border-slate-700 p-3 rounded-2xl rounded-tr-none max-w-md text-sm shadow-md"><span class="block text-[10px] text-amber-400 font-bold mb-1">${escapeHtml(sender)} (شركة الهواري)</span>${escapeHtml(text)}<span class="block text-[10px] text-slate-400 mt-1 text-left">${timeNow}</span></div></div>`;
            }
            messagesContainer.insertAdjacentHTML('beforeend', messageHTML);
        }

        window.startCall = async function() {
            unlockAudioContext();
            showCallScreen("جارِ الاتصال بالموظف...", false);
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await set(ref(db, `single_chat_room/${currentClientKey}/call`), {
                    offer: { type: offer.type, sdp: offer.sdp },
                    caller: 'client'
                });
            } catch (err) { 
                alert("يرجى السماح بالميكروفون والتاكد من توصيله"); 
                closeCallUI(); 
            }
        }

        function listenForIncomingCalls(clientKey) {
            const callRef = ref(db, `single_chat_room/${clientKey}/call`);
            onValue(callRef, async (snapshot) => {
                const data = snapshot.val();
                if (!data) { 
                    closeCallUI(); 
                    return; 
                }
                
                if (data.caller === 'employee' && !data.answer) {
                    incomingOfferData = data.offer;
                    showCallScreen("مكالمة واردة من شركة الهواري...", true);
                    if (ringAudio) {
                        ringAudio.currentTime = 0;
                        ringAudio.play().catch(e => {
                            unlockAudioContext();
                            ringAudio.play().catch(err => {});
                        });
                    }
                }

                if (data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
                    if (ringAudio && !ringAudio.paused) {
                        ringAudio.pause();
                        ringAudio.currentTime = 0;
                    }
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    startTimer();
                    document.getElementById("callStatusText").innerText = "المكالمة جارية...";
                }
            });
            onValue(ref(db, `single_chat_room/${clientKey}/call/candidates`), (snapshot) => {
                snapshot.forEach((child) => {
                    const cand = child.val();
                    if (peerConnection && cand) peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(e=>{});
                });
            });
        }

        window.answerIncomingCall = async function() {
            unlockAudioContext();
            if (ringAudio && !ringAudio.paused) {
                ringAudio.pause();
                ringAudio.currentTime = 0;
            }
            document.getElementById("answerCallBtn").classList.add("hidden");
            document.getElementById("muteBtn").classList.remove("hidden");
            document.getElementById("speakerBtn").classList.remove("hidden");
            document.getElementById("callStatusText").innerText = "جارِ الانضمام للمكالمة...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData));
                
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await set(ref(db, `single_chat_room/${currentClientKey}/call/answer`), {
                    type: answer.type,
                    sdp: answer.sdp
                });

                startTimer();
                document.getElementById("callStatusText").innerText = "المكالمة جارية...";
            } catch (err) {
                alert("يرجى السماح بالميكروفون للرد على المكالمة");
                closeCallUI();
            }
        }

        function createPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(servers);
            
            peerConnection.ontrack = (event) => { 
                if (ringAudio && !ringAudio.paused) {
                    ringAudio.pause();
                    ringAudio.currentTime = 0;
                }
                const remoteAudio = document.getElementById("remoteAudio");
                if (event.streams && event.streams[0]) {
                    remoteAudio.srcObject = event.streams[0];
                } else {
                    let inboundStream = new MediaStream();
                    inboundStream.addTrack(event.track);
                    remoteAudio.srcObject = inboundStream;
                }
                remoteAudio.play().catch(e => {});
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) push(ref(db, `single_chat_room/${currentClientKey}/call/candidates`), event.candidate.toJSON());
            };
        }

        function showCallScreen(statusText, isIncoming) {
            const callScreen = document.getElementById("callScreen");
            callScreen.classList.remove("hidden");
            callScreen.classList.add("flex");
            document.getElementById("callStatusText").innerText = statusText;
            secondsElapsed = 0;
            document.getElementById("callTimer").innerText = "00:00";

            if (isIncoming) {
                document.getElementById("answerCallBtn").classList.remove("hidden");
                document.getElementById("muteBtn").classList.add("hidden");
                document.getElementById("speakerBtn").classList.add("hidden");
            } else {
                document.getElementById("answerCallBtn").classList.add("hidden");
                document.getElementById("muteBtn").classList.remove("hidden");
                document.getElementById("speakerBtn").classList.remove("hidden");
            }
        }

        function startTimer() {
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById("callTimer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        window.endCall = function() {
            if (ringAudio && !ringAudio.paused) {
                ringAudio.pause();
                ringAudio.currentTime = 0;
            }
            if (currentClientKey) remove(ref(db, `single_chat_room/${currentClientKey}/call`));
            closeCallUI();
        }

        function closeCallUI() {
            if (ringAudio && !ringAudio.paused) {
                ringAudio.pause();
                ringAudio.currentTime = 0;
            }
            const callScreen = document.getElementById("callScreen");
            callScreen.classList.remove("flex"); 
            callScreen.classList.add("hidden");
            if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
        }

        window.toggleMute = function() {
            isMuted = !isMuted;
            if (localStream && localStream.getAudioTracks()[0]) {
                localStream.getAudioTracks()[0].enabled = !isMuted;
            }
            const muteBtn = document.getElementById("muteBtn");
            const muteIcon = document.getElementById("muteIcon");
            if (isMuted) {
                muteBtn.className = "w-14 h-14 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                muteIcon.className = "fa-solid fa-microphone-slash";
            } else {
                muteBtn.className = "w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                muteIcon.className = "fa-solid fa-microphone";
            }
        }

        window.toggleSpeaker = function() {
            isSpeakerOn = !isSpeakerOn;
            document.getElementById("remoteAudio").muted = !isSpeakerOn;
            const speakerBtn = document.getElementById("speakerBtn");
            const speakerIcon = document.getElementById("speakerIcon");
            if (isSpeakerOn) {
                speakerBtn.className = "w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                speakerIcon.className = "fa-solid fa-volume-high";
            } else {
                speakerBtn.className = "w-14 h-14 bg-amber-600 hover:bg-amber-700 rounded-full flex items-center justify-center text-lg shadow-lg transition";
                speakerIcon.className = "fa-solid fa-volume-xmark";
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
