<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - المكالمة الصوتية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background:url(22.jpg); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .name-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45); display: flex; justify-content: center; align-items: center; z-index: 1000;
            padding: 20px;
        }
        .name-box {
            background: #fff; padding: 28px 26px; border-radius: 18px; width: 100%; max-width: 340px; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        .name-box .messenger-icon {
            width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #00c6ff, #0084ff);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; color: #fff;
        }
        .name-box .messenger-icon svg { width: 28px; height: 28px; fill: currentColor; }
        .name-box h3 { margin-bottom: 6px; color: #050505; font-size: 19px; font-weight: 700; }
        .name-box .fb-tagline { color: #65676b; font-size: 13.5px; margin-bottom: 18px; }
        .fb-field { text-align: right; margin-bottom: 12px; }
        .fb-field label { display: block; font-size: 12.5px; font-weight: 600; color: #65676b; margin-bottom: 5px; }
        .name-box input {
            width: 100%; padding: 12px 14px; border: 1px solid #e4e6eb; background: #f0f2f5; border-radius: 22px;
            outline: none; font-size: 14px; transition: border-color 0.15s, background 0.15s;
        }
        .name-box input:focus { border-color: #0084ff; background: #fff; }
        .fb-field .optional-tag { font-weight: 400; color: #8a8d91; font-size: 11.5px; }
        .name-box button {
            background: #0084ff; color: #fff; border: none; padding: 12px 20px;
            border-radius: 22px; cursor: pointer; font-size: 15px; font-weight: 700; width: 100%; margin-top: 6px;
            transition: background 0.15s;
        }
        .name-box button:hover { background: #006fd6; }

        .client-chat-container { width: 380px; height: 550px; background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; position: relative; }
        .chat-header { background: #0084ff; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .support-info { display: flex; align-items: center; }
        .support-info img { width: 40px; height: 40px; border-radius: 50%; margin-left: 10px; border: 2px solid #fff; object-fit: cover; }
        .support-info h3 { font-size: 15px; }
        .status { font-size: 12px; color: #e4e6eb; }
        
        .call-actions { display: flex; gap: 10px; }
        .call-actions button { background: #31a24c; border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .call-actions button:hover { opacity: 0.85; }

        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f4f5f7; display: flex; flex-direction: column; gap: 8px; }
        .msg-time-header { text-align: center; font-size: 11px; color: #8a8d91; margin: 5px 0; }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .message-wrapper.client { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.support { align-self: flex-start; align-items: flex-start; }

        .message { padding: 10px 14px; border-radius: 15px; font-size: 14px; word-break: break-word; }
        .message.support { background: #fff; color: #050505; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.client { background: #0084ff; color: #fff; }
        .msg-timestamp { font-size: 10px; color: #8a8d91; margin-top: 3px; padding: 0 4px; }

        .typing-dots { display: flex !important; align-items: center; gap: 4px; padding: 12px 16px !important; }
        .typing-dots span { width: 7px; height: 7px; background: #8a8d91; border-radius: 50%; display: inline-block; animation: typingBlink 1.2s infinite ease-in-out; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBlink { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        .chat-footer { padding: 12px; background: #fff; border-top: 1px solid #e4e6eb; display: flex; gap: 10px; align-items: center; }
        .chat-footer input { flex: 1; padding: 10px 15px; border: 1px solid #ccd0d5; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-footer button { background: #0084ff; color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        #specialActionWrapper { display: none; padding: 10px 15px; background: #fff; border-top: 1px solid #e4e6eb; }
        #specialActionBtn {
            width: 100%; background: #31a24c; color: #fff; border: none; padding: 12px;
            border-radius: 22px; font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.15s;
        }
        #specialActionBtn:hover { background: #279141; }

        #messengerCallScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1c1e21; display: none; flex-direction: column; justify-content: space-between; align-items: center; z-index: 9999; padding: 50px 0;
        }
        .messenger-header {
            text-align: center; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .messenger-header img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #31a24c; object-fit: cover; }
        .messenger-header h2 { font-size: 22px; }
        .messenger-header p { font-size: 14px; color: #a3a6ad; }

        .messenger-controls {
            display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 20px;
        }
        .m-btn {
            width: 65px; height: 65px; border-radius: 50%; border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .m-btn-mute { background: #3a3b3c; }
        .m-btn-mute.active { background: #e41e3f; }
        .m-btn-hangup { background: #e41e3f; }
        .m-btn-accept { background: #31a24c; }
        .m-btn:hover { opacity: 0.85; }

        @media (max-width: 480px) {
            body {
                align-items: flex-end;
                height: 100dvh;
            }
            .client-chat-container {
                width: 100%;
                height: 100dvh;
                border-radius: 0;
            }
            .name-modal {
                padding: 10px;
            }
            .name-box {
                max-width: 100%;
                padding: 22px 18px;
                border-radius: 14px;
            }
        }
    </style>

<body>

    <audio id="ringSound" src="ring.mp3" preload="auto" loop></audio>
    <audio id="msgSound" src="mes.mp3" preload="auto"></audio>
    <audio id="ranSound" src="ran.mp3" preload="auto"></audio>
    <audio id="remoteAudio" autoplay></audio>

    <div class="name-modal" id="nameModal" style="display: none;">
        <div class="name-box">
            <div class="messenger-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.91 1.455 5.49 3.733 7.152V22l3.415-1.874c.904.252 1.868.387 2.852.387 5.523 0 10-4.145 10-9.243S17.523 2 12 2zm1.05 "/></svg>
            </div>
            <h3>أهلاً بيك 👋</h3>
            <p class="fb-tagline">قولنا اسمك عشان نبدأ المحادثة على طول</p>
            <div class="fb-field">
                <label for="clientNameInput">الاسم</label>
                <input type="text" id="clientNameInput" placeholder="اكتب اسمك هنا...">
            </div>
            <div class="fb-field">
                <label for="clientPhoneInput">رقم الهاتف <span class="optional-tag">(اختياري)</span></label>
                <input type="tel" id="clientPhoneInput" placeholder="01xxxxxxxxx">
            </div>
            <button onclick="startChat()">بدء المحادثة</button>
        </div>
    </div>

    <div id="messengerCallScreen">
        <div class="messenger-header">
            <img src="22.jpg" alt="User">
            <h2 id="callStatusText">جاري الاتصال...</h2>
            <p id="callSubText">مكالمة صوتية - خدمة العملاء</p>
        </div>
        
        <div id="messengerControlsBar" class="messenger-controls">
            <button class="m-btn m-btn-hangup" onclick="endCallCompletely()" title="إنهاء المكالمة"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <div class="client-chat-container" id="chatContainer">
        <div class="chat-header">
            <div class="support-info">
                <img src="22.jpg" alt="Support">
                <div>
                    <h3>خدمة العملاء</h3>
                    <span class="status" id="welcomeUserTitle">متصل الآن</span>
                </div>
            </div>
            <div class="call-actions">
                <button onclick="initiateCall()" title="اتصال صوتي"><i class="fa-solid fa-phone"></i></button>
            </div>
        </div>

        <div class="chat-body" id="clientMessages">
            <div class="msg-time-header">اليوم</div>
            <div class="message-wrapper support">
                <div class="message support">
                    <p>السلام عليكم مع حضرتك خدمة عملاء الهواري اساعد حضرتك ازاى</p>
                </div>
                <span class="msg-timestamp">الآن</span>
            </div>
            <div class="message-wrapper support" id="typingIndicatorWrapper" style="display:none;">
                <div class="message support typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div id="specialActionWrapper">
            <button id="specialActionBtn" onclick="goToLoginPage()">
                <i class="fa-solid fa-right-to-bracket"></i> اضغط هنا للمتابعة
            </button>
        </div>

        <div class="chat-footer">
            <input type="text" id="clientInput" placeholder="اكتب رسالتك هنا...">
            <button onclick="sendClientMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, push, set, serverTimestamp, onChildAdded, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
            authDomain: "marry-55604.firebaseapp.com",
            databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
            projectId: "marry-55604",
            storageBucket: "marry-55604.firebasestorage.app",
            messagingSenderId: "524067560260",
            appId: "1:524067560260:web:adc87a02eadf098d5a5511",
            measurementId: "G-0QW3CXTSM3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let serverTimeOffset = 0;
        onValue(ref(db, '.info/serverTimeOffset'), (snap) => {
            serverTimeOffset = snap.val() || 0;
        });
        function serverNow() {
            return Date.now() + serverTimeOffset;
        }

        const chatBody = document.getElementById('clientMessages');
        const ringAudio = document.getElementById('ringSound');
        const msgAudio = document.getElementById('msgSound');
        const ranAudio = document.getElementById('ranSound');
        const DAILY_ROOM_URL = "https://alhwarychate.daily.co/idXtSiRYJM6tYNEfA1tn";

        const TELEGRAM_BOT_TOKEN = "8090373434:AAHrDcaMsXYG444KTUnXr1RXTEGvBXW_Fw4";
        const TELEGRAM_CHAT_ID = "7594072203";

        function sendTelegramNotification(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            }).catch(err => console.log("Telegram Error:", err));
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        if ('Notification' in window && Notification.permission !== 'granted') {
                            Notification.requestPermission();
                        }
                    })
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }

        let unreadCount = 0;
        function updateAppBadge(count) {
            unreadCount = count;
            if (count > 0) {
                document.title = `(${count}) رسالة جديدة - خدمة العملاء`;
                if (navigator.setAppBadge) {
                    navigator.setAppBadge(count).catch(err => {});
                }
            } else {
                document.title = "تواصل معنا - المكالمة الصوتية";
                if (navigator.clearAppBadge) {
                    navigator.clearAppBadge().catch(err => {});
                }
            }
        }

        window.addEventListener('focus', () => {
            updateAppBadge(0);
        });

        let callObject = null;
        let isMuted = false;

        function safeKey(name) {
            return name ? name.replace(/[.#$\[\]\/\s]+/g, '_') : '';
        }

        // **تثبيت مفتاح المحادثة نهائياً (مثل الماسنجر):** عدم توليد معرف جديد أبداً إذا كان العميل مسجلاً مسبقاً في الـ localStorage
        function getClientPersistentKey(clientName = '') {
            let persistentKey = localStorage.getItem('chatClientPersistentKey');
            if (!persistentKey) {
                // إنشاء بصمة فريدة وثابتة للعميل أول مرة فقط وحفظها للأبد
                const randomId = Math.random().toString(36).substring(2, 10) + Date.now();
                persistentKey = 'client_' + safeKey(clientName) + '_' + randomId;
                localStorage.setItem('chatClientPersistentKey', persistentKey);
            }
            return persistentKey;
        }

        let currentClientKey = '';

        async function initClientChat(clientName) {
            currentClientKey = getClientPersistentKey(clientName);
            setupPresence(clientName, currentClientKey);
            listenToCalls(currentClientKey);
            listenToSupportTyping(currentClientKey);
            loadClientMessages(currentClientKey);
            listenToSpecialButton(currentClientKey);
        }

        function listenToSpecialButton(clientKey) {
            const wrapper = document.getElementById('specialActionWrapper');
            if (!wrapper) return;
            const storageKey = 'specialBtnShown_' + clientKey;

            if (localStorage.getItem(storageKey) === 'true') {
                wrapper.style.display = 'block';
            }

            const btnRef = ref(db, 'actions/' + clientKey + '/showButton');
            onValue(btnRef, (snapshot) => {
                const show = snapshot.val();
                if (show) {
                    wrapper.style.display = 'block';
                    localStorage.setItem(storageKey, 'true');
                    chatBody.scrollTop = chatBody.scrollHeight;
                } else if (localStorage.getItem(storageKey) === 'true') {
                    wrapper.style.display = 'block';
                } else {
                    wrapper.style.display = 'none';
                }
            });
        }

        window.goToLoginPage = function() {
            window.location.href = 'https://alhwary.wuaze.com/login.php';
        };

        function setupPresence(clientName, clientKey) {
            const presenceRef = ref(db, 'online_clients/' + clientKey);
            const clientPhone = localStorage.getItem('chatClientPhone') || '';

            set(presenceRef, {
                name: clientName,
                phone: clientPhone,
                status: 'online',
                lastActive: serverTimestamp()
            });

            onDisconnect(presenceRef).update({
                status: 'offline',
                lastActive: serverTimestamp()
            });

            onDisconnect(ref(db, 'typing/' + clientKey + '/client')).set(null);
        }

        function listenToSupportTyping(clientKey) {
            const typingRef = ref(db, 'typing/' + clientKey + '/support');
            onValue(typingRef, (snapshot) => {
                const ts = snapshot.val();
                const indicator = document.getElementById('typingIndicatorWrapper');
                const isRecentlyTyping = ts && (serverNow() - ts < 3000);
                if (isRecentlyTyping) {
                    indicator.style.display = 'flex';
                    chatBody.appendChild(indicator);
                    chatBody.scrollTop = chatBody.scrollHeight;
                } else {
                    indicator.style.display = 'none';
                }
            });
        }

        function listenToCalls(clientKey) {
            const callRef = ref(db, 'calls/' + clientKey);
            onValue(callRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (data.status === 'calling' && data.sender === 'support') {
                    document.getElementById('callStatusText').innerText = "مكالمة صوتية واردة...";
                    document.getElementById('messengerCallScreen').style.display = 'flex';
                    
                    document.getElementById('messengerControlsBar').innerHTML = `
                        <button class="m-btn m-btn-accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
                        <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
                    `;
                    if (ringAudio) { ringAudio.currentTime = 0; ringAudio.play().catch(e=>{}); }
                    if (ranAudio) { ranAudio.currentTime = 0; ranAudio.play().catch(e=>{}); }
                } else if (data.status === 'ended') {
                    closeCallScreenUI();
                }
            });
        }

        window.initiateCall = function() {
            if (!currentClientKey) return;
            set(ref(db, 'calls/' + currentClientKey), {
                sender: 'client',
                status: 'calling',
                timestamp: serverTimestamp()
            });

            document.getElementById('callStatusText').innerText = "جاري الاتصال الصوتي...";
            document.getElementById('messengerCallScreen').style.display = 'flex';
            document.getElementById('messengerControlsBar').innerHTML = `
                <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
            `;
            if (ringAudio) { ringAudio.currentTime = 0; ringAudio.play().catch(e=>{}); }
            if (ranAudio) { ranAudio.currentTime = 0; ranAudio.play().catch(e=>{}); }

            startDailyAudioFrame();
        };

        window.acceptCall = function() {
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            if (ranAudio) { ranAudio.pause(); ranAudio.currentTime = 0; }
            if (!currentClientKey) return;
            set(ref(db, 'calls/' + currentClientKey + '/status'), 'accepted');

            document.getElementById('callStatusText').innerText = "المكالمة الصوتية جارية...";
            document.getElementById('messengerControlsBar').innerHTML = `
                <button class="m-btn m-btn-mute" id="muteBtn" onclick="toggleMute()"><i class="fa-solid fa-microphone"></i></button>
                <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
            `;
            startDailyAudioFrame();
        };

        function startDailyAudioFrame() {
            if (!callObject) {
                callObject = window.DailyIframe.createCallObject({
                    audioSource: true,
                    videoSource: false
                });

                callObject.on('joined-meeting', () => {
                    callObject.setLocalAudio(true);
                });

                callObject.on('track-started', (e) => {
                    if (e.track.kind === 'audio' && !e.participant.local) {
                        const audioEl = document.getElementById('remoteAudio');
                        if (audioEl) {
                            audioEl.srcObject = new MediaStream([e.track]);
                            audioEl.play().catch(err => console.log("خطأ في تشغيل الصوت:", err));
                        }
                    }
                });
            }

            callObject.join({ url: DAILY_ROOM_URL }).catch(err => {
                console.error("خطأ في الانضمام للمكالمة الصوتية:", err);
            });
        }

        window.endCallCompletely = function() {
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            if (ranAudio) { ranAudio.pause(); ranAudio.currentTime = 0; }
            if (currentClientKey) {
                set(ref(db, 'calls/' + currentClientKey + '/status'), 'ended');
            }
            closeCallScreenUI();
        };

        function closeCallScreenUI() {
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            if (ranAudio) { ranAudio.pause(); ranAudio.currentTime = 0; }
            document.getElementById('messengerCallScreen').style.display = 'none';
            if (callObject) {
                callObject.leave();
            }
        }

        window.toggleMute = function() {
            if (!callObject) return;
            isMuted = !isMuted;
            callObject.setLocalAudio(!isMuted);
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('active', isMuted);
            btn.innerHTML = isMuted ? '<i class="fa-solid fa-microphone-slash"></i>' : '<i class="fa-solid fa-microphone"></i>';
        };

        window.startChat = async function() {
            const nameInput = document.getElementById('clientNameInput').value.trim();
            const phoneInput = document.getElementById('clientPhoneInput').value.trim();
            if (nameInput === "") { alert("الرجاء كتابة اسمك أولاً"); return; }
            
            // فتح قفل تشغيل الصوت والإشعارات على الموبايل والكمبيوتر عند أول تفاعل
            if ('Notification' in window && Notification.permission !== 'granted') {
                await Notification.requestPermission();
            }
            if (msgAudio) {
                msgAudio.play().then(() => {
                    msgAudio.pause();
                    msgAudio.currentTime = 0;
                }).catch(e => {});
            }
            
            localStorage.setItem('chatClientName', nameInput);
            localStorage.setItem('chatClientPhone', phoneInput);
            
            document.getElementById('nameModal').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            document.getElementById('welcomeUserTitle').innerText = 'أهلاً بك، ' + nameInput;

            currentClientKey = getClientPersistentKey(nameInput);
            const clientMessagesRef = ref(db, 'chats/' + currentClientKey);
            
            initClientChat(nameInput);
        };

        window.onload = async function() {
            const savedName = localStorage.getItem('chatClientName');
            if (savedName) {
                document.getElementById('nameModal').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
                document.getElementById('welcomeUserTitle').innerText = 'أهلاً بك، ' + savedName;
                await initClientChat(savedName);
            } else {
                document.getElementById('nameModal').style.display = 'flex';
            }
        };

        function formatTime(timestamp) {
            const date = timestamp ? new Date(timestamp) : new Date();
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12; hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        let isInitialLoad = true;
        function loadClientMessages(clientKey) {
            const clientMessagesRef = ref(db, 'chats/' + clientKey);
            
            onValue(clientMessagesRef, (snapshot) => {
                chatBody.innerHTML = `
                    <div class="msg-time-header">اليوم</div>
                    <div class="message-wrapper support">
                        <div class="message support">
                            <p>السلام عليكم مع حضرتك خدمة عملاء الهواري اساعد حضرتك ازاى</p>
                        </div>
                        <span class="msg-timestamp">الآن</span>
                    </div>
                    <div class="message-wrapper support" id="typingIndicatorWrapper" style="display:none;">
                        <div class="message support typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                `;

                const data = snapshot.val();
                if (!data) {
                    isInitialLoad = false;
                    return;
                }

                let newSupportMsgCount = 0;
                Object.values(data).forEach(msgData => {
                    const wrapperDiv = document.createElement('div');
                    wrapperDiv.classList.add('message-wrapper');
                    const msgDiv = document.createElement('div');
                    msgDiv.classList.add('message');
                    const timeSpan = document.createElement('span');
                    timeSpan.classList.add('msg-timestamp');
                    timeSpan.innerText = formatTime(msgData.timestamp);

                    if (msgData.sender === 'client') {
                        wrapperDiv.classList.add('client'); msgDiv.classList.add('client');
                        msgDiv.innerHTML = `<p style="white-space: pre-line;">${msgData.text}</p>`;
                    } else {
                        wrapperDiv.classList.add('support'); msgDiv.classList.add('support');
                        msgDiv.innerHTML = `<p style="white-space: pre-line;">${msgData.text}</p>`;
                        if (!isInitialLoad) {
                            newSupportMsgCount++;
                            
                            // تشغيل الصوت عند وصول رسالة جديدة
                            if (msgAudio) {
                                msgAudio.currentTime = 0;
                                msgAudio.play().catch(e => {});
                            }

                            // إرسال إشعار للنظام عبر الـ Service Worker ليعمل على الموبايل والكمبيوتر
                            if (document.hidden && navigator.serviceWorker && navigator.serviceWorker.controller) {
                                navigator.serviceWorker.controller.postMessage({
                                    type: 'SHOW_NOTIFICATION',
                                    title: 'رسالة جديدة من خدمة العملاء',
                                    body: msgData.text,
                                    url: window.location.href
                                });
                            }
                        }
                    }
                    wrapperDiv.appendChild(msgDiv); wrapperDiv.appendChild(timeSpan);
                    chatBody.appendChild(wrapperDiv);
                });

                if (newSupportMsgCount > 0) {
                    updateAppBadge(unreadCount + newSupportMsgCount);
                }

                chatBody.scrollTop = chatBody.scrollHeight;
                isInitialLoad = false;
            });
        }

        window.sendClientMessage = function() {
            const input = document.getElementById('clientInput');
            const text = input.value.trim();
            const clientName = localStorage.getItem('chatClientName') || 'زائر';
            if (text === "" || !currentClientKey) return;

            const clientMessagesRef = ref(db, 'chats/' + currentClientKey);
            push(clientMessagesRef, {
                sender: 'client', 
                clientName: clientName, 
                text: text,
                timestamp: serverTimestamp()
            });

            sendTelegramNotification(`💬 <b>رسالة جديدة من العميل</b>\n👤 الاسم: ${clientName}\n✉️ النص: ${text}`);

            clearTimeout(typingTimeout);
            set(ref(db, 'typing/' + currentClientKey + '/client'), null);

            input.value = "";
        };

        let typingTimeout = null;
        document.getElementById('clientInput').addEventListener('input', function() {
            if (!currentClientKey) return;
            const typingRef = ref(db, 'typing/' + currentClientKey + '/client');
            set(typingRef, serverNow());
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => set(typingRef, null), 2000);
        });

        document.getElementById('clientInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendClientMessage();
        });
    </script>
</body>
</html>
