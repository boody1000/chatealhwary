<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل مع الدعم - شركة الهواري</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Daily.co Call Object SDK -->
    <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col h-screen justify-between p-4">

    <!-- رأسية المحادثة -->
    <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center shadow-lg">
        <h2 class="text-xl font-bold text-emerald-400">محادثة خدمة العملاء</h2>
        <!-- زر اتصال العميل -->
        <button id="client-call-btn" onclick="clientStartCall()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg transition duration-200 flex items-center gap-2">
            📞 اتصال صوتي بالمورد
        </button>
    </div>

    <!-- شاشة اتصال العميل النشطة -->
    <div id="client-call-screen" class="hidden flex flex-col items-center justify-center flex-1 bg-slate-800/50 rounded-xl p-6 my-4 border border-slate-700">
        <div class="animate-pulse text-emerald-400 text-lg font-bold mb-2">المكالمة الصوتية جارية...</div>
        <div id="client-call-timer" class="text-2xl font-mono mb-6">00:00</div>
        <button onclick="clientEndCall()" class="bg-rose-600 hover:bg-rose-500 text-white px-6 py-2 rounded-full font-semibold transition duration-200">
            إنهاء المكالمة ❌
        </button>
    </div>

    <!-- صندوق رسائل العميل -->
    <div id="client-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-800/20 rounded-xl my-4 border border-slate-800"></div>

    <!-- إرسال الرسائل -->
    <div class="flex gap-2">
        <input type="text" id="client-msg-input" placeholder="اكتب استفسارك هنا..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500">
        <button onclick="sendClientMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg font-semibold transition">إرسال</button>
    </div>

    <!-- Firebase Scripts & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForAppStructure",
            authDomain: "alhwarychate.firebaseapp.com",
            databaseURL: "https://alhwarychate-default-rtdb.firebaseio.com",
            projectId: "alhwarychate",
            storageBucket: "alhwarychate.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;

        window.roomKey = "client_room_123"; // مفتاح الغرفة الخاص بالعميل
        window.isClientCallActiveOrRinging = false;
        window.callFrame = null;
        window.activeCallRoomUrl = "";
        let clientTimerInterval = null;

        // دالة بدء الاتصال من طرف العميل
        window.clientStartCall = async function() {
            if (window.isClientCallActiveOrRinging) return;
            window.isClientCallActiveOrRinging = true;
            showClientCallScreen();

            try {
                const response = await fetch('https://api.daily.co/v1/rooms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer 0c2d7732a3d0774681fb789ff945b0a88ef3d386927dca4740e256b82c5a0895'
                    },
                    body: JSON.stringify({
                        properties: { exp: Math.floor(Date.now() / 1000) + 3600 }
                    })
                });
                
                const roomData = await response.json();
                if (!roomData.url) throw new Error("فشل إنشاء الغرفة");
                
                window.activeCallRoomUrl = roomData.url;

                await set(ref(db, `single_chat_room/${window.roomKey}/call`), {
                    roomUrl: window.activeCallRoomUrl,
                    type: 'offer',
                    sender: 'client'
                });

                window.callFrame = DailyIframe.createCallObject({ audioSource: true, videoSource: false });
                await window.callFrame.join({ url: window.activeCallRoomUrl });
                startClientTimer();
            } catch(e) {
                console.error("Daily start error:", e);
                alert("تعذر بدء الاتصال");
                clientEndCall();
            }
        };

        window.clientEndCall = async function() {
            window.isClientCallActiveOrRinging = false;
            if (window.callFrame) {
                await window.callFrame.destroy();
                window.callFrame = null;
            }
            await set(ref(db, `single_chat_room/${window.roomKey}/call`), null);
            hideClientCallScreen();
            stopClientTimer();
        };

        function showClientCallScreen() {
            document.getElementById('client-call-screen').classList.remove('hidden');
            document.getElementById('client-call-btn').classList.add('hidden');
        }

        function hideClientCallScreen() {
            document.getElementById('client-call-screen').classList.add('hidden');
            document.getElementById('client-call-btn').classList.remove('hidden');
        }

        function startClientTimer() {
            let seconds = 0;
            const timerEl = document.getElementById('client-call-timer');
            clearInterval(clientTimerInterval);
            clientTimerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopClientTimer() {
            clearInterval(clientTimerInterval);
            document.getElementById('client-call-timer').textContent = "00:00";
        }
    </script>
</body>
</html>
