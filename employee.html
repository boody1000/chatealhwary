<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم شركة الهواري - خدمة العملاء</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="22.jpg" type="image/jpeg">
  <style>
   ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }

    .bg-custom-watermark {
      background: url('22.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-[100dvh] overflow-hidden bg-custom-watermark">
  <div class="flex h-full w-full backdrop-blur-sm relative overflow-hidden">
    
    <!-- الصفحة الأولى: قائمة العملاء -->
    <section id="sidebarPage" class="w-full h-full bg-slate-950/95 flex flex-col z-20 transition-all duration-300 absolute inset-0">
      <div class="p-3.5 sm:p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/90">
        <div class="flex items-center gap-3">
          <img src="22.jpg" alt="Logo" class="w-9 h-9 rounded-full object-cover border border-amber-500/50 shadow-sm">
          <div>
            <h2 class="text-sm font-bold text-amber-400">الهواري</h2>
            <span class="text-[10px] sm:text-[11px] text-slate-400">رسائل العملاء الواردة</span>
          </div>
        </div>
        <div class="text-[11px] sm:text-xs text-amber-400 font-semibold bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 truncate max-w-[120px] sm:max-w-xs" id="loggedInUsername">موظف الدعم</div>
      </div>
      <div class="p-3 border-b border-slate-800/60 bg-slate-900/60">
        <input type="text" id="searchClient" placeholder="بحث عن عميل..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500 text-slate-100 shadow-inner">
      </div>
      
      <div id="chatsList" class="flex-1 overflow-y-auto divide-y divide-slate-800/40">
        <div class="p-6 text-center text-slate-500 text-sm">جاري جلب العملاء...</div>
      </div>
    </section>

    <!-- الصفحة الثانية: محادثة العميل -->
    <main id="chatPage" class="hidden w-full h-full flex-col bg-slate-900/95 z-30 absolute inset-0">
      <header class="h-14 sm:h-16 border-b border-slate-800 px-3 sm:px-6 flex items-center justify-between bg-slate-950/95 shadow-md">
        <div class="flex items-center space-x-2 sm:space-x-3 space-x-reverse min-w-0">
          <button onclick="backToSidebar()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition border border-slate-700 shrink-0" title="الرجوع لقائمة العملاء">
            <i class="fa-solid fa-arrow-right text-sm sm:text-base"></i>
          </button>

          <div class="relative shrink-0">
            <img id="currentAvatar" src="22.jpg" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full object-cover border border-amber-500/40" alt="User">
            <span class="absolute bottom-0 left-0 w-2.5 h-2.5 sm:w-3 sm:h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
          </div>
          <div class="min-w-0 pr-1">
            <h3 id="currentName" class="text-xs sm:text-sm font-bold text-slate-200 truncate">اسم العميل</h3>
            <span id="chatLockStatus" class="text-[9px] sm:text-[10px] text-amber-400 font-medium block truncate">متصل</span>
          </div>
        </div>
        
        <div class="flex items-center gap-2 shrink-0">
          <button id="callClientBtn" onclick="employeeStartCall()" class="w-9 h-9 sm:w-10 sm:h-10 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center justify-center transition shadow-md hidden" title="اتصال صوتي بالعميل">
            <i class="fa-solid fa-phone text-xs sm:text-sm"></i>
          </button>
        </div>
      </header>

      <!-- صندوق الرسائل -->
      <div id="messageContainer" class="flex-1 p-3 sm:p-6 overflow-y-auto flex flex-col space-y-3 text-slate-300">
        <div class="text-center text-slate-500 my-auto bg-slate-950/40 p-4 sm:p-6 rounded-2xl border border-slate-800/60 backdrop-blur-sm max-w-sm sm:max-w-md mx-auto">
          <p class="text-xs text-slate-400">جاري تحميل المحادثة...</p>
        </div>
      </div>

      <!-- شريط الإرسال -->
      <div class="p-2.5 sm:p-3 border-t border-slate-800 bg-slate-950/95">
        <form id="messageForm" class="flex items-center space-x-2 space-x-reverse" onsubmit="sendMessage(event)">
          <input type="text" id="messageInput" placeholder="اكتب ردك للعميل..." autocomplete="off" class="flex-1 bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-3.5 sm:px-4 py-2.5 sm:py-3 text-xs sm:text-sm focus:outline-none focus:border-amber-500">
          <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-semibold transition shrink-0">إرسال</button>
        </form>
      </div>
    </main>

  </div>

  <!-- شاشة استقبال المكالمات -->
  <div id="incomingCallModal" class="fixed inset-0 bg-slate-950/90 z-50 hidden flex-col items-center justify-center text-white backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full text-center">
      <div class="w-20 h-20 sm:w-24 sm:h-24 bg-amber-600/20 text-amber-400 rounded-full flex items-center justify-center overflow-hidden mb-4 border-2 border-amber-500 animate-bounce">
        <img src="22.jpg" alt="Logo" class="w-full h-full object-cover">
      </div>
      <h3 class="text-base sm:text-lg font-bold mb-1">مكالمة صوتية واردة!</h3>
      <p id="incomingCallerName" class="text-xs sm:text-sm text-emerald-400 font-medium mb-6">العميل يتصل بك الآن...</p>
      
      <div class="flex items-center gap-3 w-full">
        <button onclick="rejectIncomingCall()" class="flex-1 bg-red-600 hover:bg-red-700 py-2.5 sm:py-3 rounded-xl font-semibold transition text-xs sm:text-sm">رفض</button>
        <button onclick="acceptIncomingCall()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-2.5 sm:py-3 rounded-xl font-semibold transition text-xs sm:text-sm">رد</button>
      </div>
    </div>
  </div>

  <!-- شاشة المكالمة النشطة للموظف -->
  <div id="employeeCallScreen" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex-col items-center justify-between p-6 sm:p-8 text-white">
    <div class="flex flex-col items-center mt-8 sm:mt-12">
      <div class="w-24 h-24 sm:w-28 sm:h-28 bg-slate-800 rounded-full flex items-center justify-center overflow-hidden mb-4 shadow-xl border-2 border-emerald-500 animate-pulse">
        <img src="22.jpg" alt="Logo" class="w-full h-full object-cover">
      </div>
      <h2 id="empCallStatus" class="text-lg sm:text-xl font-bold mb-1 text-center">المكالمة جارية مع العميل</h2>
      <p class="text-xs text-slate-400 mt-1" id="empCallTimer">00:00</p>
    </div>
    
    <div class="flex items-center gap-5 sm:gap-6 mb-8 sm:mb-12">
      <button id="muteMicBtn" onclick="toggleMuteMic()" class="w-12 h-12 sm:w-14 sm:h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-base sm:text-lg shadow-lg transition border border-slate-700" title="كتم/إلغاء كتم الميكروفون">
        <i class="fa-solid fa-microphone" id="muteIcon"></i>
      </button>

      <button onclick="employeeEndCall()" class="w-14 h-14 sm:w-16 sm:h-16 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-lg sm:text-xl shadow-lg transition" title="إنهاء المكالمة">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

  <audio id="empRemoteAudio" autoplay playsinline></audio>
  <audio id="empRingAudio" src="ran.mp3" preload="auto" loop></audio>
  <audio id="msgNotificationAudio" src="mes.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove, onDisconnect, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
        authDomain: "marry-55604.firebaseapp.com",
        databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
        projectId: "marry-55604",
        storageBucket: "marry-55604.firebasestorage.app",
        messagingSenderId: "524067560260",
        appId: "1:524067560260:web:adc87a02eadf098d5a5511",
        measurementId: "G-0QW3CXTSM3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let activeClientKey = null;
    let activeClientDisplayName = null;
    let currentEmpName = "موظف الدعم";
    let empCleanId = "default_emp";
    let peerConnection = null;
    let localStream = null;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let empTimerInterval = null;
    let empSeconds = 0;
    let pendingOffer = null;

    const empRingAudio = document.getElementById("empRingAudio");
    const msgNotificationAudio = document.getElementById("msgNotificationAudio");

    const unreadCounts = {};
    const previousMessagesCounts = {};
    let isFirstLoad = true;

    document.addEventListener('click', () => {
        if (empRingAudio.paused) {
            empRingAudio.play().then(() => { empRingAudio.pause(); empRingAudio.currentTime = 0; }).catch(e => {});
        }
        if (msgNotificationAudio.paused) {
            msgNotificationAudio.play().then(() => { msgNotificationAudio.play().catch(e => {}); msgNotificationAudio.pause(); msgNotificationAudio.currentTime = 0; }).catch(e => {});
        }
    }, { once: true });

    window.backToSidebar = function() {
      document.getElementById('chatPage').classList.add('hidden');
      document.getElementById('chatPage').classList.remove('flex');
      
      document.getElementById('sidebarPage').classList.remove('hidden');
      document.getElementById('sidebarPage').classList.add('flex');
      
      if (activeClientKey) {
        set(ref(db, `single_chat_room/${activeClientKey}/lockedBy`), null);
        activeClientKey = null;
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const loggedUser = localStorage.getItem('loggedUsername');
      if (loggedUser) {
        currentEmpName = loggedUser;
        document.getElementById('loggedInUsername').innerText = currentEmpName;
      }

      empCleanId = currentEmpName.replace(/\s+/g, '_');
      const empStatusRef = ref(db, 'online_employees/' + empCleanId);
      set(empStatusRef, { name: currentEmpName, inCall: false, lastActive: Date.now() });
      onDisconnect(empStatusRef).remove();

      const chatRoomsRef = ref(db, 'single_chat_room');
      onValue(chatRoomsRef, (snapshot) => {
        const chatsListEl = document.getElementById('chatsList');
        chatsListEl.innerHTML = '';

        if (snapshot.exists()) {
          snapshot.forEach((roomSnapshot) => {
            const roomKey = roomSnapshot.key; 
            const originalName = roomKey.replace(/_/g, ' ');
            let lastMessageText = "انقر لعرض المحادثة";
            let totalMessagesCount = 0;
            let lockedBy = null;

            if (unreadCounts[roomKey] === undefined) {
              unreadCounts[roomKey] = 0;
            }

            roomSnapshot.forEach((msgChild) => {
              if(msgChild.key === 'call') {
                const callVal = msgChild.val();
                if (callVal) {
                  checkIncomingCallForRoom(roomKey, originalName, callVal);
                }
                return;
              }

              if(msgChild.key === 'lockedBy') {
                lockedBy = msgChild.val();
                return;
              }

              const msg = msgChild.val();
              if (msg && msg.text) {
                totalMessagesCount++;
                lastMessageText = msg.text;
              }
            });

            if (!isFirstLoad && previousMessagesCounts[roomKey] !== undefined && totalMessagesCount > previousMessagesCounts[roomKey]) {
              const diff = totalMessagesCount - previousMessagesCounts[roomKey];
              if (activeClientKey !== roomKey && diff > 0) {
                unreadCounts[roomKey] = (unreadCounts[roomKey] || 0) + diff;
                
                if (msgNotificationAudio) {
                  msgNotificationAudio.currentTime = 0;
                  msgNotificationAudio.play().catch(err => {});
                }
              }
            }

            previousMessagesCounts[roomKey] = totalMessagesCount;

            const currentCount = unreadCounts[roomKey];
            const badgeHTML = currentCount > 0 
              ? `<div class="flex items-center gap-1 bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-lg animate-pulse"><i class="fa-solid fa-bell text-[9px]"></i><span>${currentCount}</span></div>` 
              : '';

            const lockBadge = lockedBy 
              ? `<span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/30 truncate max-w-[100px]">مع: ${escapeHtml(lockedBy)}</span>` 
              : '';

            const chatItemHTML = `
              <div onclick="switchChat('${escapeHtml(roomKey)}', '${escapeHtml(originalName)}')" class="p-3.5 sm:p-4 hover:bg-slate-800/80 cursor-pointer transition flex items-center space-x-3 space-x-reverse border-b border-slate-800/50">
                <div class="relative shrink-0">
                  <img src="22.jpg" class="w-11 h-11 sm:w-12 sm:h-12 rounded-full object-cover border border-amber-500/40" alt="User">
                  <span class="absolute bottom-0 left-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between mb-1">
                    <h3 class="text-sm sm:text-base font-bold text-white truncate">${escapeHtml(originalName)}</h3>
                    <div id="badge-container-${escapeHtml(roomKey)}">${badgeHTML}</div>
                  </div>
                  <div class="flex items-center justify-between gap-2">
                    <p class="text-xs text-slate-400 truncate flex-1">${escapeHtml(lastMessageText)}</p>
                    ${lockBadge}
                  </div>
                </div>
              </div>
            `;
            chatsListEl.insertAdjacentHTML('beforeend', chatItemHTML);
          });
          isFirstLoad = false;
        } else {
          chatsListEl.innerHTML = '<div class="p-6 text-center text-slate-500 text-sm">لا توجد محادثات عملاء حالياً</div>';
          isFirstLoad = false;
        }
      });
    });

    function checkIncomingCallForRoom(roomKey, displayName, callData) {
      if (callData && callData.offer && callData.caller === 'client' && !callData.answer) {
        if (callData.status === 'answered' || callData.status === 'accepted' || callData.status === 'rejected') {
          if (pendingOffer && pendingOffer.roomKey === roomKey) {
            stopRinging();
            document.getElementById("incomingCallModal").style.display = "none";
            pendingOffer = null;
          }
          return;
        }

        if (document.getElementById("employeeCallScreen").classList.contains("hidden")) {
          pendingOffer = { roomKey, displayName, offer: callData.offer };
          document.getElementById("incomingCallerName").innerText = `العميل: ${displayName} يتصل بك...`;
          document.getElementById("incomingCallModal").style.display = "flex";
          if (empRingAudio.paused) {
            empRingAudio.play().catch(e => {});
          }
        }
      } else {
        if (pendingOffer && pendingOffer.roomKey === roomKey) {
          stopRinging();
          document.getElementById("incomingCallModal").style.display = "none";
          pendingOffer = null;
        }
      }
    }

    function stopRinging() {
      if (!empRingAudio.paused) {
        empRingAudio.pause();
        empRingAudio.currentTime = 0;
      }
    }

    window.switchChat = function(roomKey, displayName) {
      document.getElementById('sidebarPage').classList.add('hidden');
      document.getElementById('sidebarPage').classList.remove('flex');

      document.getElementById('chatPage').classList.remove('hidden');
      document.getElementById('chatPage').classList.add('flex');

      if (activeClientKey && activeClientKey !== roomKey) {
        set(ref(db, `single_chat_room/${activeClientKey}/lockedBy`), null);
      }

      activeClientKey = roomKey;
      activeClientDisplayName = displayName;
      
      unreadCounts[roomKey] = 0;
      const badgeContainer = document.getElementById(`badge-container-${roomKey}`);
      if (badgeContainer) badgeContainer.innerHTML = '';

      document.getElementById('currentName').innerText = displayName;
      document.getElementById('callClientBtn').classList.remove('hidden');
      document.getElementById('chatLockStatus').innerText = "جاري قفل الشات...";

      set(ref(db, `single_chat_room/${roomKey}/lockedBy`), currentEmpName);

      const container = document.getElementById('messageContainer');
      container.innerHTML = '<div class="text-slate-500 text-center my-auto">جاري تحميل الرسائل...</div>'; 

      const chatRef = ref(db, 'single_chat_room/' + roomKey);

      let isInitialChatLoad = true;
      let lastMsgKey = null;

      onValue(chatRef, (snapshot) => {
        container.innerHTML = '';
        let hasMessages = false;
        let latestKey = null;
        let latestMsgObj = null;
        
        if (snapshot.exists()) {
          snapshot.forEach((childSnapshot) => {
            if(childSnapshot.key === 'call') return;
            
            if(childSnapshot.key === 'lockedBy') {
              const locker = childSnapshot.val();
              if(locker && locker !== currentEmpName) {
                document.getElementById('chatLockStatus').innerText = `⚠️ قيد الرد بواسطة: ${locker}`;
              } else if(locker === currentEmpName) {
                document.getElementById('chatLockStatus').innerText = "✅ متصل وتحت إدارتك";
              }
              return;
            }

            const msg = childSnapshot.val();
            if(!msg || !msg.text) return;
            
            hasMessages = true;
            latestKey = childSnapshot.key;
            latestMsgObj = msg;

            const isClientMsg = (msg.senderRole === 'client' || msg.sender === displayName || msg.senderKey === roomKey);
            appendMessageToUI(msg.text, msg.sender || displayName, msg.timestamp, isClientMsg);
          });

          // تشغيل صوت mes.mp3 إذا وصلت رسالة جديدة من العميل وأنت داخل المحادثة
          if (!isInitialChatLoad && latestKey !== lastMsgKey && latestMsgObj) {
            const isClientMsg = (latestMsgObj.senderRole === 'client' || latestMsgObj.sender === displayName || latestMsgObj.senderKey === roomKey);
            if (isClientMsg && msgNotificationAudio) {
              msgNotificationAudio.currentTime = 0;
              msgNotificationAudio.play().catch(err => {});
            }
          }
          if (latestKey) lastMsgKey = latestKey;
        }
        
        isInitialChatLoad = false;

        if (!hasMessages) {
          container.innerHTML = '<div class="text-slate-500 text-center my-auto">لا توجد رسائل سابقة مع هذا العميل</div>';
        }
        container.scrollTop = container.scrollHeight;
      });
    };

    window.sendMessage = async function(event) {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if(text === '') return;
      if(!activeClientKey) { alert("الرجاء اختيار عميل أولاً!"); return; }

      const chatRef = ref(db, 'single_chat_room/' + activeClientKey);
      try {
        await update(chatRef, {
          lockedBy: currentEmpName
        });

        await push(chatRef, { 
          text: text, 
          sender: currentEmpName, 
          senderRole: "employee", 
          timestamp: Date.now() 
        });
        
        input.value = ''; 
      } catch (error) { console.error(error); }
    };

    window.acceptIncomingCall = async function() {
      if (!pendingOffer) return;
      stopRinging();
      
      activeClientKey = pendingOffer.roomKey;
      activeClientDisplayName = pendingOffer.displayName;

      document.getElementById("incomingCallModal").style.display = "none";
      
      document.getElementById('sidebarPage').classList.add('hidden');
      document.getElementById('sidebarPage').classList.remove('flex');
      document.getElementById('chatPage').classList.remove('hidden');
      document.getElementById('chatPage').classList.add('flex');

      showEmployeeCallScreen();

      set(ref(db, `online_employees/${empCleanId}/inCall`), true);
      set(ref(db, `single_chat_room/${activeClientKey}/lockedBy`), currentEmpName);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        createPeerConnection(activeClientKey);
        
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });
        
        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        
        await update(ref(db, `single_chat_room/${activeClientKey}/call`), {
          answer: { type: answer.type, sdp: answer.sdp },
          status: 'answered',
          answeredBy: currentEmpName
        });

        listenForCandidates(activeClientKey);
        startEmpTimer();
      } catch(err) { 
        employeeEndCall(); 
      }
    };

    window.rejectIncomingCall = async function() {
      stopRinging();
      if (pendingOffer) {
        const roomKey = pendingOffer.roomKey;
        await update(ref(db, `single_chat_room/${roomKey}/call`), {
          status: 'rejected'
        });
      }
      document.getElementById("incomingCallModal").style.display = "none";
      pendingOffer = null;
    };

    window.employeeStartCall = async function() {
      if (!activeClientKey) return;
      showEmployeeCallScreen();

      set(ref(db, `online_employees/${empCleanId}/inCall`), true);
      set(ref(db, `single_chat_room/${activeClientKey}/lockedBy`), currentEmpName);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        createPeerConnection(activeClientKey);
        
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, `single_chat_room/${activeClientKey}/call`), {
          offer: { type: offer.type, sdp: offer.sdp },
          caller: 'employee',
          targetEmployee: currentEmpName,
          status: 'calling'
        });

        onValue(ref(db, `single_chat_room/${activeClientKey}/call`), async (snapshot) => {
          const callData = snapshot.val();
          if (!callData) { closeEmpCallUI(); return; }
          if (callData.answer && peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.answer));
            startEmpTimer();
          }
        });
        listenForCandidates(activeClientKey);
      } catch (err) { employeeEndCall(); }
    };

    function createPeerConnection(roomKey) {
      if (peerConnection) return;
      peerConnection = new RTCPeerConnection(servers);
      
      peerConnection.ontrack = (event) => { 
        stopRinging();
        const remoteAudio = document.getElementById("empRemoteAudio");
        if (event.streams && event.streams[0]) {
            remoteAudio.srcObject = event.streams[0];
        } else {
            let inboundStream = new MediaStream();
            inboundStream.addTrack(event.track);
            remoteAudio.srcObject = inboundStream;
        }
        remoteAudio.play().catch(e => console.log("Audio play error:", e));
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) push(ref(db, `single_chat_room/${roomKey}/call/candidates`), event.candidate.toJSON());
      };
    }

    function listenForCandidates(roomKey) {
      onValue(ref(db, `single_chat_room/${roomKey}/call/candidates`), (snapshot) => {
        snapshot.forEach((child) => {
          const cand = child.val();
          if (peerConnection && cand) {
            peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(e => {});
          }
        });
      });
    }

    function showEmployeeCallScreen() {
      stopRinging();
      const screen = document.getElementById("employeeCallScreen");
      screen.classList.remove("hidden"); screen.classList.add("flex");
      empSeconds = 0;
      document.getElementById("empCallTimer").innerText = "00:00";
    }

    function startEmpTimer() {
      if (empTimerInterval) clearInterval(empTimerInterval);
      empTimerInterval = setInterval(() => {
        empSeconds++;
        const mins = Math.floor(empSeconds / 60).toString().padStart(2, '0');
        const secs = (empSeconds % 60).toString().padStart(2, '0');
        document.getElementById("empCallTimer").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    window.toggleMuteMic = function() {
      if (!localStream || !localStream.getAudioTracks()[0]) return;
      const audioTrack = localStream.getAudioTracks()[0];
      audioTrack.enabled = !audioTrack.enabled;
      const muteBtn = document.getElementById("muteMicBtn");
      const muteIcon = document.getElementById("muteIcon");
      if (audioTrack.enabled) {
        muteBtn.className = "w-12 h-12 sm:w-14 sm:h-14 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-base sm:text-lg shadow-lg transition border border-slate-700";
        muteIcon.className = "fa-solid fa-microphone";
      } else {
        muteBtn.className = "w-12 h-12 sm:w-14 sm:h-14 bg-amber-600 hover:bg-amber-700 rounded-full flex items-center justify-center text-base sm:text-lg shadow-lg transition border border-amber-500";
        muteIcon.className = "fa-solid fa-microphone-slash";
      }
    };

    window.employeeEndCall = function() {
      stopRinging();
      if (activeClientKey) remove(ref(db, `single_chat_room/${activeClientKey}/call`));
      closeEmpCallUI();
    };

    function closeEmpCallUI() {
      stopRinging();
      const screen = document.getElementById("employeeCallScreen");
      screen.classList.remove("flex"); screen.classList.add("hidden");
      document.getElementById("incomingCallModal").style.display = "none";
      pendingOffer = null;

      if (currentEmpName) {
        set(ref(db, `online_employees/${empCleanId}/inCall`), false);
      }

      if (empTimerInterval) { clearInterval(empTimerInterval); empTimerInterval = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
    }

    function appendMessageToUI(text, sender, timestamp, isClientMsg) {
      const container = document.getElementById('messageContainer');
      const timeNow = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'الآن';
      let messageHTML = '';
      if (!isClientMsg) {
        messageHTML = `<div class="flex flex-col items-end w-full"><div class="bg-amber-600 text-white p-3 rounded-2xl rounded-tl-none max-w-[85%] sm:max-w-md text-xs sm:text-sm shadow-md"><span class="block text-[9px] sm:text-[10px] text-amber-200 font-bold mb-1">${escapeHtml(sender)} (أنت)</span><span class="break-words">${escapeHtml(text)}</span><span class="block text-[9px] sm:text-[10px] text-amber-200 mt-1 text-left">${timeNow}</span></div></div>`;
      } else {
        messageHTML = `<div class="flex flex-col items-start w-full"><div class="bg-slate-800 text-slate-100 border border-slate-700 p-3 rounded-2xl rounded-tr-none max-w-[85%] sm:max-w-md text-xs sm:text-sm shadow-md"><span class="block text-[9px] sm:text-[10px] text-amber-400 font-bold mb-1">${escapeHtml(sender)} (عميل)</span><span class="break-words">${escapeHtml(text)}</span><span class="block text-[9px] sm:text-[10px] text-slate-400 mt-1 text-left">${timeNow}</span></div></div>`;
      }
      container.insertAdjacentHTML('beforeend', messageHTML);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.toString().replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
