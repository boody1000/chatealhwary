<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم شركة الهواري - خدمة العملاء</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
   ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: url(22.jpg); }
    ::-webkit-scrollbar-thumb { background: url(22.jpg); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: url(22.jpg); }

    .bg-custom-watermark {
      background: url('22.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen overflow-hidden bg-custom-watermark">
  <div class="flex h-full backdrop-blur-sm">
    
    <!-- القائمة الجانبية للعملاء -->
    <section class="w-80 bg-slate-950/70 border-r border-slate-800 flex flex-col">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="22.jpg" alt="Logo" class="w-9 h-9 rounded-full object-cover border border-amber-500/50">
          <div>
            <h2 class="text-sm font-bold text-amber-400">الهواري</h2>
            <span class="text-[11px] text-slate-400">رسائل العملاء الواردة</span>
          </div>
        </div>
        <button onclick="changeEmployeeSession()" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-2.5 py-1 rounded-lg border border-slate-700 transition" title="تغيير هوية الموظف لهذه الصفحة">
          <i class="fa-solid fa-user-gear ml-1"></i>هويتي
        </button>
      </div>
      <div class="p-3 border-b border-slate-800/60">
        <input type="text" id="searchClient" placeholder="بحث عن عميل..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
      </div>
      
      <div id="chatsList" class="flex-1 overflow-y-auto divide-y divide-slate-800/40">
        <div class="p-4 text-center text-slate-500 text-sm">جاري جلب العملاء...</div>
      </div>
    </section>

    <!-- مساحة الدردشة النشطة -->
    <main class="flex-1 flex flex-col bg-slate-900/60">
      <header class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-950/60">
        <div class="flex items-center space-x-3 space-x-reverse">
          <div class="relative">
            <img id="currentAvatar" src="22.jpg" class="w-10 h-10 rounded-full object-cover border border-amber-500/40" alt="User">
            <span class="absolute bottom-0 left-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
          </div>
          <div>
            <h3 id="loggedInUsername" class="text-sm font-bold text-amber-400">موظف الدعم</h3>
            <span class="text-xs text-green-400">متصل (جلسة مستقلة)</span>
          </div>
        </div>
        
        <div class="flex items-center gap-4">
          <h3 id="currentName" class="text-sm font-bold text-slate-200">اختر محادثة من القائمة</h3>
          <button id="callClientBtn" onclick="employeeStartCall()" class="w-10 h-10 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center justify-center transition shadow-md hidden" title="اتصال صوتي بالعميل">
            <i class="fa-solid fa-phone text-sm"></i>
          </button>
        </div>
      </header>

      <!-- صندوق الرسائل -->
      <div id="messageContainer" class="flex-1 p-6 overflow-y-auto flex flex-col space-y-3 text-slate-300">
        <div class="text-center text-slate-500 my-auto bg-slate-950/40 p-6 rounded-2xl border border-slate-800/60 backdrop-blur-sm max-w-md mx-auto">
          <img src="22.jpg" alt="Logo" class="w-16 h-16 mx-auto rounded-full object-cover mb-3 border border-amber-500/40">
          <p class="font-bold text-amber-400 mb-1">لوحة تحكم شركة الهواري</p>
          <p class="text-xs text-slate-400">الرجاء اختيار عميل من القائمة الجانبية للبدء في المراسلة</p>
        </div>
      </div>

      <!-- شريط الإرسال -->
      <div class="p-4 border-t border-slate-800 bg-slate-950/60">
        <form id="messageForm" class="flex items-center space-x-2 space-x-reverse" onsubmit="sendMessage(event)">
          <input type="text" id="messageInput" placeholder="اكتب ردك للعميل..." autocomplete="off" class="flex-1 bg-slate-800 border border-slate-700 text-slate-100 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
          <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition">إرسال</button>
        </form>
      </div>
    </main>

  </div>

  <!-- شاشة استقبال المكالمات (تظهر حصرياً للموظف المسؤول عن العميل) -->
  <div id="incomingCallModal" class="fixed inset-0 bg-slate-950/90 z-50 hidden flex-col items-center justify-center text-white backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full text-center">
      <div class="w-24 h-24 bg-amber-600/20 text-amber-400 rounded-full flex items-center justify-center overflow-hidden mb-4 border-2 border-amber-500 animate-bounce">
        <img src="22.jpg" alt="Logo" class="w-full h-full object-cover">
      </div>
      <h3 class="text-lg font-bold mb-1">مكالمة صوتية واردة!</h3>
      <p id="incomingCallerName" class="text-sm text-emerald-400 font-medium mb-6">العميل يتصل بك الآن...</p>
      
      <div class="flex items-center gap-4 w-full">
        <button onclick="rejectIncomingCall()" class="flex-1 bg-red-600 hover:bg-red-700 py-3 rounded-xl font-semibold transition text-sm">رفض / تخطي</button>
        <button onclick="acceptIncomingCall()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-semibold transition text-sm">رد</button>
      </div>
    </div>
  </div>

  <!-- شاشة المكالمة النشطة للموظف -->
  <div id="employeeCallScreen" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex-col items-center justify-between p-8 text-white">
    <div class="flex flex-col items-center mt-12">
      <div class="w-28 h-28 bg-slate-800 rounded-full flex items-center justify-center overflow-hidden mb-4 shadow-xl border-2 border-emerald-500 animate-pulse">
        <img src="22.jpg" alt="Logo" class="w-full h-full object-cover">
      </div>
      <h2 id="empCallStatus" class="text-xl font-bold mb-1">المكالمة جارية مع العميل</h2>
      <p class="text-xs text-slate-400 mt-1" id="empCallTimer">00:00</p>
    </div>
    
    <div class="flex items-center gap-6 mb-12">
      <button id="muteBtn" onclick="toggleMuteMic()" class="w-14 h-14 bg-slate-700 hover:bg-slate-600 rounded-full flex items-center justify-center text-lg shadow-lg transition" title="كتم الصوت">
        <i id="muteIcon" class="fa-solid fa-microphone"></i>
      </button>

      <button onclick="employeeEndCall()" class="w-16 h-16 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-xl shadow-lg transition" title="إنهاء المكالمة">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

  <audio id="empRemoteAudio" autoplay></audio>
  <audio id="empRingAudio" src="ran.mp3" preload="auto" loop></audio>
  <audio id="msgNotificationAudio" src="rnn.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
        authDomain: "marry-55604.firebaseapp.com",
        databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
        projectId: "marry-55604",
        storageBucket: "marry-55604.firebasestorage.app",
        messagingSenderId: "524067560260",
        appId: "1:524067560260:web:adc87a02eadf098d5a5511",
        measurementId: "G-0QW3CXTSM3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let activeClientKey = null;
    let activeClientDisplayName = null;
    let currentEmpName = "";
    let peerConnection = null;
    let localStream = null;
    let isMuted = false;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let empTimerInterval = null;
    let empSeconds = 0;
    let pendingOffer = null;
    let chatUnsubscribe = null; // لإلغاء المراقبة القديمة عند تغيير الشات

    const empRingAudio = document.getElementById("empRingAudio");
    const msgNotificationAudio = document.getElementById("msgNotificationAudio");

    const unreadCounts = {};
    const previousMessagesCounts = {};
    let isFirstLoad = true;

    function initSessionIdentity() {
      let sessionEmp = sessionStorage.getItem('uniqueEmpSession');
      if (!sessionEmp) {
        sessionEmp = prompt("أدخل اسم الموظف أو رقم الحافظة لهذه الصفحة:", "موظف_" + Math.floor(Math.random() * 8999 + 1000));
        if (!sessionEmp || sessionEmp.trim() === "") sessionEmp = "موظف_" + Math.floor(Math.random() * 8999 + 1000);
        sessionStorage.setItem('uniqueEmpSession', sessionEmp.trim());
      }
      currentEmpName = sessionEmp.trim();
      document.getElementById('loggedInUsername').innerText = currentEmpName;
    }

    window.changeEmployeeSession = function() {
      const newName = prompt("تغيير اسم هوية الموظف في هذه الصفحة:", currentEmpName);
      if (newName && newName.trim() !== "") {
        sessionStorage.setItem('uniqueEmpSession', newName.trim());
        location.reload();
      }
    };

    document.addEventListener('click', () => {
        if (empRingAudio.paused) {
            empRingAudio.play().then(() => { empRingAudio.pause(); empRingAudio.currentTime = 0; }).catch(e => {});
        }
        if (msgNotificationAudio.paused) {
            msgNotificationAudio.play().then(() => { msgNotificationAudio.pause(); msgNotificationAudio.currentTime = 0; }).catch(e => {});
        }
    }, { once: true });

    window.addEventListener('DOMContentLoaded', () => {
      initSessionIdentity();

      if (currentEmpName) {
        const empCleanId = currentEmpName.replace(/\s+/g, '_');
        const empStatusRef = ref(db, 'online_employees_sessions/' + empCleanId);
        set(empStatusRef, { name: currentEmpName, inCall: false, lastActive: Date.now() });
        onDisconnect(empStatusRef).remove();
      }

      const chatRoomsRef = ref(db, 'single_chat_room');
      onValue(chatRoomsRef, (snapshot) => {
        const chatsListEl = document.getElementById('chatsList');
        chatsListEl.innerHTML = '';

        if (snapshot.exists()) {
          snapshot.forEach((roomSnapshot) => {
            const roomKey = roomSnapshot.key; 
            const originalName = roomKey.replace(/_/g, ' ');
            let hasActiveCall = false;
            let lastMessageText = "انقر لعرض المحادثة";
            let totalMessagesCount = 0;
            let assignedEmployee = null;

            if (unreadCounts[roomKey] === undefined) {
              unreadCounts[roomKey] = 0;
            }

            roomSnapshot.forEach((msgChild) => {
              if(msgChild.key === 'assignedTo') {
                assignedEmployee = msgChild.val();
              }
              if(msgChild.key === 'call') {
                const callVal = msgChild.val();
                if (callVal) {
                  hasActiveCall = true;
                  checkIncomingCallForRoom(roomKey, originalName, callVal, assignedEmployee);
                }
                return;
              }

              const msg = msgChild.val();
              if (msg && msg.text) {
                totalMessagesCount++;
                lastMessageText = msg.text;
              }
            });

            if (!isFirstLoad && previousMessagesCounts[roomKey] !== undefined && totalMessagesCount > previousMessagesCounts[roomKey]) {
              const diff = totalMessagesCount - previousMessagesCounts[roomKey];
              if (activeClientKey !== roomKey && diff > 0) {
                unreadCounts[roomKey] = (unreadCounts[roomKey] || 0) + diff;
                if (msgNotificationAudio) {
                  msgNotificationAudio.currentTime = 0;
                  msgNotificationAudio.play().catch(err => {});
                }
              }
            }

            previousMessagesCounts[roomKey] = totalMessagesCount;

            if (activeClientKey === roomKey && !hasActiveCall) {
              closeEmpCallUI();
            }

            const currentCount = unreadCounts[roomKey];
            const badgeHTML = currentCount > 0 
              ? `<div class="flex items-center gap-1 bg-red-600 text-white text-xs font-black px-2.5 py-0.5 rounded-full shadow-lg animate-pulse"><i class="fa-solid fa-bell text-[10px]"></i><span>${currentCount}</span></div>` 
              : '';

            const assignedBadge = assignedEmployee ? `<span class="text-[10px] text-amber-400 block mt-0.5"><i class="fa-solid fa-lock text-[9px]"></i> يتابع بواسطة: ${escapeHtml(assignedEmployee)}</span>` : '';

            const chatItemHTML = `
              <div onclick="switchChat('${escapeHtml(roomKey)}', '${escapeHtml(originalName)}')" class="p-3 hover:bg-slate-800/60 cursor-pointer transition flex items-center space-x-3 space-x-reverse border-b border-slate-800/40">
                <div class="relative">
                  <img src="22.jpg" class="w-10 h-10 rounded-full object-cover border border-amber-500/40" alt="User">
                  <span class="absolute bottom-0 left-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between mb-0.5">
                    <h3 class="text-sm font-semibold truncate text-white">${escapeHtml(originalName)}</h3>
                    <div id="badge-container-${escapeHtml(roomKey)}">${badgeHTML}</div>
                  </div>
                  <p class="text-xs text-slate-400 truncate">${escapeHtml(lastMessageText)}</p>
                  ${assignedBadge}
                </div>
              </div>
            `;
            chatsListEl.insertAdjacentHTML('beforeend', chatItemHTML);
          });
          isFirstLoad = false;
        } else {
          chatsListEl.innerHTML = '<div class="p-4 text-center text-slate-500 text-sm">لا توجد محادثات عملاء حالياً</div>';
          isFirstLoad = false;
        }
      });
    });

    // دالة فحص المكالمات مع عزل تام: ترن فقط عند الموظف الذي يتابع العميل أو المسجل كـ targetEmployee
    function checkIncomingCallForRoom(roomKey, displayName, callData, assignedEmployee) {
      if (callData && callData.offer && callData.caller === 'client' && !callData.answer) {
        const targetEmp = callData.targetEmployee || assignedEmployee;
        
        if (targetEmp && targetEmp === currentEmpName) {
          if (document.getElementById("employeeCallScreen").classList.contains("hidden")) {
            pendingOffer = { roomKey, displayName, offer: callData.offer };
            document.getElementById("incomingCallerName").innerText = `العميل: ${displayName} يتصل بك...`;
            document.getElementById("incomingCallModal").style.display = "flex";
            if (empRingAudio.paused) {
              empRingAudio.play().catch(e => {});
            }
          }
        } else {
          // إذا كانت المكالمة موجهة لموظف آخر، تأكد من إيقاف الرنين لدي هذا الموظف تماماً
          if (pendingOffer && pendingOffer.roomKey === roomKey) {
            document.getElementById("incomingCallModal").style.display = "none";
            if (!empRingAudio.paused) { empRingAudio.pause(); empRingAudio.currentTime = 0; }
            pendingOffer = null;
          }
        }
      }
    }

    window.switchChat = function(roomKey, displayName) {
      activeClientKey = roomKey;
      activeClientDisplayName = displayName;
      
      unreadCounts[roomKey] = 0;
      const badgeContainer = document.getElementById(`badge-container-${roomKey}`);
      if (badgeContainer) badgeContainer.innerHTML = '';

      // حجز المحادثة والمكالمة حصرياً لهذا الموظف لتفادي أي تداخل نهائياً
      set(ref(db, `single_chat_room/${roomKey}/assignedTo`), currentEmpName);
      set(ref(db, `single_chat_room/${roomKey}/call/targetEmployee`), currentEmpName);

      document.getElementById('currentName').innerText = "محادثة مع: " + displayName;
      document.getElementById('callClientBtn').classList.remove('hidden');
      
      const container = document.getElementById('messageContainer');
      container.innerHTML = '<div class="text-slate-500 text-center my-auto">جاري تحميل الرسائل...</div>'; 

      const chatRef = ref(db, 'single_chat_room/' + roomKey);
      
      if (chatUnsubscribe) {
        // إيقاف المراقبة السابقة إن وجدت لمنع التداخل بين الشاتات المفتوحة
      }

      onValue(chatRef, (snapshot) => {
        if (activeClientKey !== roomKey) return; // منع التداخل إذا انتقل لشات آخر
        container.innerHTML = '';
        if (snapshot.exists()) {
          snapshot.forEach((childSnapshot) => {
            if(childSnapshot.key === 'call' || childSnapshot.key === 'assignedTo' || childSnapshot.key === 'candidates') {
              if (childSnapshot.key === 'call' && !childSnapshot.val() && !document.getElementById("employeeCallScreen").classList.contains("hidden")) {
                closeEmpCallUI();
              }
              return;
            }
            const msg = childSnapshot.val();
            if(!msg || !msg.text) return;
            const isClientMsg = (msg.sender === displayName || msg.sender === roomKey || msg.senderRole === 'client');
            appendMessageToUI(msg.text, msg.sender || displayName, msg.timestamp, isClientMsg);
          });
        } else {
          container.innerHTML = '<div class="text-slate-500 text-center my-auto">لا توجد رسائل سابقة مع هذا العميل</div>';
        }
        container.scrollTop = container.scrollHeight;
      });
    };

    window.sendMessage = async function(event) {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if(text === '') return;
      if(!activeClientKey) { alert("الرجاء اختيار عميل أولاً!"); return; }

      const chatRef = ref(db, 'single_chat_room/' + activeClientKey);
      try {
        await push(chatRef, { text: text, sender: currentEmpName, senderRole: "employee", timestamp: Date.now() });
        input.value = ''; 
      } catch (error) { console.error(error); }
    };

    window.acceptIncomingCall = async function() {
      if (!pendingOffer) return;
      if (!empRingAudio.paused) {
        empRingAudio.pause();
        empRingAudio.currentTime = 0;
      }
      activeClientKey = pendingOffer.roomKey;
      activeClientDisplayName = pendingOffer.displayName;

      document.getElementById("incomingCallModal").style.display = "none";
      showEmployeeCallScreen();

      const empCleanId = currentEmpName.replace(/\s+/g, '_');
      set(ref(db, `online_employees_sessions/${empCleanId}/inCall`), true);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        isMuted = false;
        updateMuteButtonUI();

        createPeerConnection(activeClientKey);
        
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        
        await set(ref(db, `single_chat_room/${activeClientKey}/call/answer`), { type: answer.type, sdp: answer.sdp });
        listenForCandidates(activeClientKey);
        startEmpTimer();
      } catch(err) { 
        console.error("Call accept error:", err);
        employeeEndCall(); 
      }
    };

    window.rejectIncomingCall = function() {
      if (!empRingAudio.paused) {
        empRingAudio.pause();
        empRingAudio.currentTime = 0;
      }
      if(pendingOffer) {
        const roomKey = pendingOffer.roomKey;
        remove(ref(db, `single_chat_room/${roomKey}/call`));
      }
      document.getElementById("incomingCallModal").style.display = "none";
      pendingOffer = null;
    };

    window.employeeStartCall = async function() {
      if (!activeClientKey) return;
      showEmployeeCallScreen();

      const empCleanId = currentEmpName.replace(/\s+/g, '_');
      set(ref(db, `online_employees_sessions/${empCleanId}/inCall`), true);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        isMuted = false;
        updateMuteButtonUI();

        createPeerConnection(activeClientKey);
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, `single_chat_room/${activeClientKey}/call`), {
          offer: { type: offer.type, sdp: offer.sdp },
          caller: 'employee',
          targetEmployee: currentEmpName
        });

        onValue(ref(db, `single_chat_room/${activeClientKey}/call`), async (snapshot) => {
          const callData = snapshot.val();
          if (!callData) { closeEmpCallUI(); return; }
          if (callData.answer && peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.answer));
            startEmpTimer();
          }
        });
        listenForCandidates(activeClientKey);
      } catch (err) { 
        console.error("Start call error:", err);
        employeeEndCall(); 
      }
    };

    window.toggleMuteMic = function() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (!audioTrack) return;

      isMuted = !isMuted;
      audioTrack.enabled = !isMuted;
      updateMuteButtonUI();
    };

    function updateMuteButtonUI() {
      const btn = document.getElementById("muteBtn");
      const icon = document.getElementById("muteIcon");
      if (isMuted) {
        btn.classList.remove("bg-slate-700", "hover:bg-slate-600");
        btn.classList.add("bg-amber-600", "hover:bg-amber-700");
        icon.className = "fa-solid fa-microphone-slash";
        btn.title = "إلغاء الكتم";
      } else {
        btn.classList.remove("bg-amber-600", "hover:bg-amber-700");
        btn.classList.add("bg-slate-700", "hover:bg-slate-600");
        icon.className = "fa-solid fa-microphone";
        btn.title = "كتم الصوت";
      }
    }

    function createPeerConnection(roomKey) {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      peerConnection = new RTCPeerConnection(servers);
      
      peerConnection.ontrack = (event) => { 
        if (!empRingAudio.paused) {
          empRingAudio.pause();
          empRingAudio.currentTime = 0;
        }
        const remoteAudio = document.getElementById("empRemoteAudio");
        remoteAudio.srcObject = event.streams[0]; 
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          push(ref(db, `single_chat_room/${roomKey}/call/candidates`), event.candidate.toJSON());
        }
      };
    }

    function listenForCandidates(roomKey) {
      onValue(ref(db, `single_chat_room/${roomKey}/call/candidates`), (snapshot) => {
        snapshot.forEach((child) => {
          const cand = child.val();
          if (peerConnection && cand && peerConnection.remoteDescription) {
            peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(e => {});
          }
        });
      });
    }

    function showEmployeeCallScreen() {
      if (!empRingAudio.paused) {
        empRingAudio.pause();
        empRingAudio.currentTime = 0;
      }
      const screen = document.getElementById("employeeCallScreen");
      screen.classList.remove("hidden"); screen.classList.add("flex");
      empSeconds = 0;
      document.getElementById("empCallTimer").innerText = "00:00";
    }

    function startEmpTimer() {
      if (empTimerInterval) clearInterval(empTimerInterval);
      empTimerInterval = setInterval(() => {
        empSeconds++;
        const mins = Math.floor(empSeconds / 60).toString().padStart(2, '0');
        const secs = (empSeconds % 60).toString().padStart(2, '0');
        document.getElementById("empCallTimer").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    window.employeeEndCall = function() {
      if (!empRingAudio.paused) {
        empRingAudio.pause();
        empRingAudio.currentTime = 0;
      }
      if (activeClientKey) remove(ref(db, `single_chat_room/${activeClientKey}/call`));
      closeEmpCallUI();
    };

    function closeEmpCallUI() {
      if (!empRingAudio.paused) {
        empRingAudio.pause();
        empRingAudio.currentTime = 0;
      }
      const screen = document.getElementById("employeeCallScreen");
      screen.classList.remove("flex"); screen.classList.add("hidden");
      document.getElementById("incomingCallModal").style.display = "none";
      pendingOffer = null;

      if (currentEmpName) {
        const empCleanId = currentEmpName.replace(/\s+/g, '_');
        set(ref(db, `online_employees_sessions/${empCleanId}/inCall`), false);
      }

      if (empTimerInterval) { clearInterval(empTimerInterval); empTimerInterval = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
    }

    function appendMessageToUI(text, sender, timestamp, isClientMsg) {
      const container = document.getElementById('messageContainer');
      const timeNow = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'الآن';
      let messageHTML = '';
      if (!isClientMsg) {
        messageHTML = `<div class="flex flex-col items-end w-full"><div class="bg-amber-600 text-white p-3 rounded-2xl rounded-tl-none max-w-md text-sm shadow-md"><span class="block text-[10px] text-amber-200 font-bold mb-1">${escapeHtml(sender)} (أنت)</span>${escapeHtml(text)}<span class="block text-[10px] text-amber-200 mt-1 text-left">${timeNow}</span></div></div>`;
      } else {
        messageHTML = `<div class="flex flex-col items-start w-full"><div class="bg-slate-800/95 text-slate-100 border border-slate-700 p-3 rounded-2xl rounded-tr-none max-w-md text-sm shadow-md"><span class="block text-[10px] text-amber-400 font-bold mb-1">${escapeHtml(sender)} (عميل)</span>${escapeHtml(text)}<span class="block text-[10px] text-slate-400 mt-1 text-left">${timeNow}</span></div></div>`;
      }
      container.insertAdjacentHTML('beforeend', messageHTML);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.toString().replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
