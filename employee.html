<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الدعم الفني - قائمة العملاء والشات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .main-container { display: flex; width: 95vw; height: 90vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); overflow: hidden; position: relative; }
        
        .clients-sidebar { width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff; position: absolute; top: 0; right: 0; transition: transform 0.3s ease-in-out; z-index: 2; }
        .sidebar-header { padding: 15px 20px; border-bottom: 1px solid #f0f2f5; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { font-size: 18px; color: #050505; }
        
        .sound-enable-banner { background: #e7f3ff; color: #1877f2; padding: 10px 15px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d0e8ff; font-weight: bold; }
        .sound-enable-banner button { background: #1877f2; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        .search-box { padding: 15px 20px; position: relative; }
        .search-box input { width: 100%; padding: 10px 35px 10px 15px; background: #f0f2f5; border: none; border-radius: 20px; outline: none; font-size: 14px; }
        .search-box i { position: absolute; right: 35px; top: 25px; color: #65676b; }
        
        .clients-list { overflow-y: auto; flex: 1; }
        .client-card { display: flex; align-items: center; padding: 15px 20px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f9f9f9; position: relative; }
        .client-card:hover, .client-card.active { background: #f0f2f5; }
        .client-card img { width: 50px; height: 50px; border-radius: 50%; margin-left: 15px; object-fit: cover; }
        .client-card-info { flex: 1; }
        .client-card-info h4 { font-size: 15px; color: #050505; display: flex; justify-content: space-between; align-items: center; }
        .client-card-info p { font-size: 13px; color: #65676b; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }

        /* تنسيق شارة عداد الرسائل غير المقروءة مثل الماسنجر */
        .client-card.unread .client-card-info h4 { font-weight: bold; color: #000; }
        .client-card.unread .client-card-info p { font-weight: bold; color: #000; }
        .unread-badge { background-color: #0084ff; color: #fff; font-size: 12px; font-weight: bold; padding: 2px 7px; border-radius: 50%; min-width: 20px; text-align: center; display: inline-block; }

        .chat-section { width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff; position: absolute; top: 0; right: 0; transform: translateX(-100%); transition: transform 0.3s ease-in-out; z-index: 3; }
        .chat-section.show-screen { transform: translateX(0); }
        
        .no-chat-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #8a8d91; gap: 10px; }
        .no-chat-screen i { font-size: 50px; color: #ccd0d5; }
        
        .chat-box-container { display: none; flex-direction: column; height: 100%; position: relative; }
        
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #e4e6eb; display: flex; align-items: center; background: #fff; gap: 12px; justify-content: space-between; }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #0084ff; padding: 5px; }
        .chat-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .chat-header h3 { font-size: 16px; color: #050505; }
        .chat-header .status { font-size: 12px; color: #31a24c; }

        .call-actions { display: flex; gap: 10px; }
        .call-actions button { background: #f0f2f5; border: none; color: #0084ff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .call-actions button:hover { background: #e4e6eb; }

        .chat-messages-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f4f5f7; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 65%; }
        .message-wrapper.client { align-self: flex-start; align-items: flex-start; }
        .message-wrapper.support { align-self: flex-end; align-items: flex-end; }
        .message { padding: 10px 15px; border-radius: 15px; font-size: 14px; word-break: break-word; }
        .message.client { background: #fff; color: #050505; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.support { background: #0084ff; color: #fff; }
        .msg-timestamp { font-size: 10px; color: #8a8d91; margin-top: 3px; padding: 0 4px; }

        .chat-footer-input { padding: 15px 20px; background: #fff; border-top: 1px solid #e4e6eb; display: flex; align-items: center; gap: 15px; }
        .chat-footer-input input { flex: 1; padding: 12px 18px; background: #f0f2f5; border: none; border-radius: 25px; outline: none; font-size: 14px; }
        .chat-footer-input button { background: #0084ff; color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 16px; }

        /* شاشة المكالمة الصوتية للموظف */
        #messengerCallScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1c1e21; display: none; flex-direction: column; justify-content: space-between; align-items: center; z-index: 9999; padding: 50px 0;
        }
        .messenger-header {
            text-align: center; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .messenger-header img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #31a24c; object-fit: cover; }
        .messenger-header h2 { font-size: 22px; }
        .messenger-header p { font-size: 14px; color: #a3a6ad; }

        .messenger-controls {
            display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 20px;
        }
        .m-btn {
            width: 65px; height: 65px; border-radius: 50%; border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .m-btn-mute { background: #3a3b3c; }
        .m-btn-mute.active { background: #e41e3f; }
        .m-btn-hangup { background: #e41e3f; }
        .m-btn-accept { background: #31a24c; }
        .m-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <audio id="ringSound" preload="auto" loop></audio>
    <audio id="remoteAudio" autoplay></audio>

    <!-- شاشة المكالمة الصوتية للموظف -->
    <div id="messengerCallScreen">
        <div class="messenger-header">
            <img src="https://i.pravatar.cc/150?img=12" id="messengerAvatar" alt="User">
            <h2 id="callStatusText">مكالمة واردة...</h2>
            <p id="callSubText">مكالمة صوتية - الدعم الفني</p>
        </div>
        
        <div id="messengerControlsBar" class="messenger-controls">
            <button class="m-btn m-btn-accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
            <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <div class="main-container">
        <div class="clients-sidebar" id="clientsSidebar">
            <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h2>لوحة تحكم الموظف - العملاء المتواصلون</h2>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="loggedEmployeeName" style="font-size: 14px; font-weight: bold; color: #050505;">موظف</span>
                    <img src="22.jpg" alt="Employee Avatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                </div>
            </div>
            
            <div class="sound-enable-banner" id="soundBanner">
                <span><i class="fa-solid fa-volume-high"></i> اضغط لتفعيل صوت التنبيهات وإشعارات المتصفح</span>
                <button onclick="enableAudioAndNotifications()">تفعيل التنبيهات</button>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchClientInput" placeholder="بحث عن اسم العميل...">
            </div>

            <div class="clients-list" id="clientsListContainer"></div>
        </div>

        <div class="chat-section" id="chatSection">
            <div class="no-chat-screen" id="noChatScreen">
                <i class="fa-regular fa-comments"></i>
                <h3>اختر عميلاً من القائمة لبدء المحادثة</h3>
            </div>

            <div class="chat-box-container" id="chatBoxContainer">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <button class="back-btn" onclick="goBackToClients()"><i class="fa-solid fa-arrow-right"></i></button>
                        <img src="" id="currentChatAvatar" alt="Client Avatar">
                        <div>
                            <h3 id="currentChatClientName">اسم العميل</h3>
                            <span class="status"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> متصل الآن</span>
                        </div>
                    </div>
                    <div class="call-actions">
                        <button onclick="initiateCall()" title="اتصال صوتي"><i class="fa-solid fa-phone"></i></button>
                    </div>
                </div>

                <div class="chat-messages-body" id="chatMessagesBody"></div>

                    <div class="chat-footer-input">
                    <input type="text" id="supportReplyInput" placeholder="اكتب ردك هنا...">
                    <button onclick="sendSupportReply()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
            authDomain: "marry-55604.firebaseapp.com",
            databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
            projectId: "marry-55604",
            storageBucket: "marry-55604.firebasestorage.app",
            messagingSenderId: "524067560260",
            appId: "1:524067560260:web:adc87a02eadf098d5a5511",
            measurementId: "G-0QW3CXTSM3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatsRef = ref(db, 'chats/');
        const DAILY_ROOM_URL = "https://alhwarychate.daily.co/idXtSiRYJM6tYNEfA1tn";

        // تخزين طوابع زمنية آخر قراءة لكل عميل محلياً لتحديد الرسائل غير المقروءة
        let clientLastSeenMap = JSON.parse(localStorage.getItem('clientLastSeenMap') || '{}');

        // بيانات بوت التليجرام المدمجة
        const TELEGRAM_BOT_TOKEN = "8090373434:AAHrDcaMsXYG444KTUnXr1RXTEGvBXW_Fw4";
        const TELEGRAM_CHAT_ID = "7594072203";

        function sendTelegramNotification(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            }).catch(err => console.log("Telegram Error:", err));
        }

        // توليد رنة اتصال قياسية (نغمة هاتف منتظمة باستخدام Web Audio API) لتجنب مشاكل الملفات الخارجية
        function playStandardRingTone() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';
                // الترددات المتعارف عليها لنغمات الهواتف القياسية (US standard ringback tone approx 440 + 480 Hz)
                osc1.frequency.setValueAtTime(440, now);
                osc2.frequency.setValueAtTime(480, now);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.setValueAtTime(0, now + 2.0); // رنة لمدة ثانيتين ثم صمت

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 2.0);
                osc2.stop(now + 2.0);
            } catch(e) {}
        }

        let standardRingInterval = null;
        function startStandardRinging() {
            stopStandardRinging();
            playStandardRingTone();
            standardRingInterval = setInterval(() => {
                playStandardRingTone();
            }, 4000); // تكرار النغمة كل 4 ثوانٍ تماماً كالهواتف الحقيقية
        }

        function stopStandardRinging() {
            if (standardRingInterval) {
                clearInterval(standardRingInterval);
                standardRingInterval = null;
            }
        }

        // تسجيل وتشغيل الـ Service Worker لإشعارات الموبايل والكمبيوتر (مطابق لملف sw_2.js)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw_2.js')
                    .then(reg => console.log('ServiceWorker registered:', reg.scope))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }

        // إرسال إشعار عبر الـ Service Worker لسطح المكتب والموبايل
        function showPushNotification(title, body) {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'SHOW_NOTIFICATION',
                    title: title,
                    body: body,
                    url: window.location.href
                });
            } else if (Notification.permission === 'granted') {
                try {
                    new Notification(title, {
                        body: body,
                        icon: './22.jpg',
                        badge: './22.jpg',
                        vibrate: [300, 100, 300, 100, 300]
                    });
                } catch(e) {}
            }
        }

        const loggedUser = localStorage.getItem('loggedUsername');
        if (loggedUser) {
            document.getElementById('loggedEmployeeName').innerText = loggedUser;
        }

        let activeClientName = null;
        let isInitialLoad = true;
        let knownMessagesKeys = new Set();
        let audioCtx = null;
        let isAudioUnlocked = false;
        let callObject = null;
        let isMuted = false;
        const ringAudio = document.getElementById('ringSound');
        let callStartTime = null;
        let mediaRecorder = null;
        let recordedAudioChunks = [];

        function listenToAllCalls() {
            const callsRef = ref(db, 'calls/');
            onValue(callsRef, (snapshot) => {
                const callsData = snapshot.val();
                if (!callsData) {
                    closeCallScreenUI();
                    return;
                }
                
                let hasActiveIncomingCall = false;
                Object.keys(callsData).forEach(cName => {
                    let callObj = callsData[cName];
                    if (callObj.status === 'calling' && callObj.sender === 'client') {
                        hasActiveIncomingCall = true;
                        activeClientName = cName;
                        document.getElementById('callStatusText').innerText = `مكالمة واردة من: ${cName}`;
                        document.getElementById('messengerCallScreen').style.display = 'flex';
                        document.getElementById('messengerControlsBar').innerHTML = `
                            <button class="m-btn m-btn-accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
                            <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
                        `;
                        if (!standardRingInterval) {
                            startStandardRinging();
                        }
                        if (ringAudio && ringAudio.src && !ringAudio.src.endsWith(window.location.href) && ringAudio.paused) { 
                            ringAudio.currentTime = 0; 
                            ringAudio.play().catch(e=>{}); 
                        }
                    } else if (callObj.status === 'accepted' || callObj.status === 'ended') {
                        // إذا تم قبول المكالمة أو انتهت، يتم إيقاف الرنين عند باقي الموظفين فوراً لعدم الإزعاج
                        if (activeClientName === cName && callObj.status === 'ended') {
                            closeCallScreenUI();
                        } else if (callObj.status === 'accepted') {
                            stopStandardRinging();
                            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
                            if (document.getElementById('messengerCallScreen').style.display === 'flex' && callObj.sender !== loggedUser) {
                                document.getElementById('messengerCallScreen').style.display = 'none';
                            }
                        }
                    }
                });

                if (!hasActiveIncomingCall) {
                    closeCallScreenUI();
                }
            });
        }

        window.initiateCall = function() {
            if (!activeClientName) { alert("اختر عميلاً أولاً"); return; }
            callStartTime = Date.now();
            set(ref(db, 'calls/' + activeClientName), {
                sender: 'support',
                status: 'calling',
                timestamp: callStartTime
            });

            document.getElementById('callStatusText').innerText = "جاري الاتصال الصوتي...";
            document.getElementById('messengerCallScreen').style.display = 'flex';
            document.getElementById('messengerControlsBar').innerHTML = `
                <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
            `;
            startStandardRinging();
            if (ringAudio && ringAudio.src && !ringAudio.src.endsWith(window.location.href)) { 
                ringAudio.currentTime = 0; 
                ringAudio.play().catch(e=>{}); 
            }

            startDailyAudioFrame();
        };

        window.acceptCall = function() {
            stopStandardRinging();
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            callStartTime = Date.now();
            if (activeClientName) {
                set(ref(db, 'calls/' + activeClientName), {
                    sender: loggedUser || 'support',
                    status: 'accepted',
                    timestamp: callStartTime
                });
            }

            document.getElementById('callStatusText').innerText = "المكالمة الصوتية جارية...";
            document.getElementById('messengerControlsBar').innerHTML = `
                <button class="m-btn m-btn-mute" id="muteBtn" onclick="toggleMute()"><i class="fa-solid fa-microphone"></i></button>
                <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
            `;
            startDailyAudioFrame();
        };

        function startDailyAudioFrame() {
            if (!callObject) {
                callObject = window.DailyIframe.createCallObject({
                    audioSource: true,
                    videoSource: false
                });

                callObject.on('joined-meeting', () => {
                    console.log("تم الانضمام للمكالمة الصوتية بنجاح");
                    callObject.setLocalAudio(true);
                });

                callObject.on('track-started', (e) => {
                    if (e.track.kind === 'audio' && !e.participant.local) {
                        const audioEl = document.getElementById('remoteAudio');
                        if (audioEl) {
                            audioEl.srcObject = new MediaStream([e.track]);
                            audioEl.play().catch(err => console.log("خطأ في تشغيل الصوت:", err));
                            
                            // بدء تسجيل المكالمة أثناء حدوثها باستخدام دمج الصوتيات وتخزينها بعد الإغلاق
                            try {
                                const localStream = callObject.participants().local?.audioStream || new MediaStream();
                                const combinedStream = new MediaStream([...localStream.getTracks(), ...e.track.clone().mediaStream.getTracks()]);
                                mediaRecorder = new MediaRecorder(combinedStream);
                                recordedAudioChunks = [];
                                mediaRecorder.ondataavailable = (event) => {
                                    if (event.data.size > 0) {
                                        recordedAudioChunks.push(event.data);
                                    }
                                };
                                mediaRecorder.onstop = () => {
                                    const audioBlob = new Blob(recordedAudioChunks, { type: 'audio/webm' });
                                    const reader = new FileReader();
                                    reader.onloadend = function() {
                                        const base64Audio = reader.result;
                                        const endTime = Date.now();
                                        const durationSeconds = callStartTime ? Math.floor((endTime - callStartTime) / 1000) : 0;
                                        
                                        push(ref(db, 'call_logs/'), {
                                            clientName: activeClientName,
                                            employeeName: loggedUser || 'موظف',
                                            startTime: callStartTime ? new Date(callStartTime).toLocaleString('ar-EG') : '',
                                            endTime: new Date(endTime).toLocaleString('ar-EG'),
                                            duration: durationSeconds + ' ثانية',
                                            audioData: base64Audio,
                                            timestamp: endTime
                                        });

                                        sendTelegramNotification(`📞 <b>تم تسجيل مكالمة جديدة</b>\n👤 العميل: ${activeClientName}\n👨‍💼 الموظف: ${loggedUser || 'موظف'}\n⏱️ المدة: ${durationSeconds} ثانية`);
                                    };
                                    reader.readAsDataURL(audioBlob);
                                };
                                mediaRecorder.start();
                            } catch (err) {
                                console.log("خطأ في بدء تسجيل المكالمة:", err);
                            }
                        }
                    }
                });
            }

            callObject.join({ url: DAILY_ROOM_URL }).catch(err => {
                console.error("خطأ في الانضمام للمكالمة الصوتية:", err);
            });
        }

        window.endCallCompletely = function() {
            stopStandardRinging();
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            } else if (activeClientName) {
                const endTime = Date.now();
                const durationSeconds = callStartTime ? Math.floor((endTime - callStartTime) / 1000) : 0;
                
                push(ref(db, 'call_logs/'), {
                    clientName: activeClientName,
                    employeeName: loggedUser || 'موظف',
                    startTime: callStartTime ? new Date(callStartTime).toLocaleString('ar-EG') : '',
                    endTime: new Date(endTime).toLocaleString('ar-EG'),
                    duration: durationSeconds + ' ثانية',
                    timestamp: endTime
                });

                sendTelegramNotification(`📞 <b>تم تسجيل مكالمة جديدة</b>\n👤 العميل: ${activeClientName}\n👨‍💼 الموظف: ${loggedUser || 'موظف'}\n⏱️ المدة: ${durationSeconds} ثانية`);
            }

            if (activeClientName) {
                set(ref(db, 'calls/' + activeClientName + '/status'), 'ended');
            }
            closeCallScreenUI();
        };

        function closeCallScreenUI() {
            stopStandardRinging();
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            document.getElementById('messengerCallScreen').style.display = 'none';
            callStartTime = null;
            mediaRecorder = null;
            recordedAudioChunks = [];
            if (callObject) {
                callObject.leave();
            }
        }

        window.toggleMute = function() {
            if (!callObject) return;
            isMuted = !isMuted;
            callObject.setLocalAudio(!isMuted);
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('active', isMuted);
            btn.innerHTML = isMuted ? '<i class="fa-solid fa-microphone-slash"></i>' : '<i class="fa-solid fa-microphone"></i>';
        };

        window.enableAudioAndNotifications = function() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                isAudioUnlocked = true;
                if ('Notification' in window) {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            showPushNotification('تم تفعيل التنبيهات', 'ستصلك إشعارات الرسائل الجديدة على الموبايل والكمبيوتر');
                        }
                    });
                }
                document.getElementById('soundBanner').style.display = 'none';
                listenToAllCalls();
            } catch (e) { alert("حدث خطأ"); }
        };

        function playNotificationSound() {
            if (!isAudioUnlocked || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12; hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        onValue(chatsRef, (snapshot) => {
            const data = snapshot.val();
            const clientsListEl = document.getElementById('clientsListContainer');
            clientsListEl.innerHTML = '';
            if (!data) {
                clientsListEl.innerHTML = '<p style="text-align:center; color:#8a8d91; padding:20px;">لا توجد محادثات حتى الآن</p>';
                isInitialLoad = false;
                return;
            }
            let currentKeys = Object.keys(data);
            if (!isInitialLoad) {
                currentKeys.forEach(key => {
                    if (!knownMessagesKeys.has(key)) {
                        let newMsg = data[key];
                        if (newMsg.sender === 'client') {
                            playNotificationSound();
                            // إرسال إشعار تليجرام عند استلام رسالة جديدة من العميل
                            sendTelegramNotification(`💬 <b>رسالة جديدة من عميل</b>\n👤 الاسم: ${newMsg.clientName || 'زائر'}\n✉️ النص: ${newMsg.text}`);
                            // إشعار سطح المكتب والموبايل عبر الـ Service Worker
                            showPushNotification(`رسالة جديدة من: ${newMsg.clientName || 'زائر'}`, newMsg.text);
                        }
                    }
                });
            }
            knownMessagesKeys = new Set(currentKeys);
            isInitialLoad = false;

            let clientsMap = {};
            currentKeys.forEach(key => {
                let msg = data[key];
                let cName = msg.clientName || 'زائر';
                if (!clientsMap[cName]) clientsMap[cName] = [];
                clientsMap[cName].push(msg);
            });

            // تحويل خريطة العملاء إلى مصفوفة وترتيبها تنازلياً بحسب أحدث رسالة لتظهر المحادثة النشطة في الأعلى تماماً مثل الماسنجر
            let clientsArray = Object.keys(clientsMap).map(cName => {
                let clientMsgs = clientsMap[cName];
                let lastMsg = clientMsgs[clientMsgs.length - 1];
                return {
                    cName: cName,
                    messages: clientMsgs,
                    lastMsg: lastMsg,
                    lastTimestamp: lastMsg.timestamp || 0
                };
            });

            clientsArray.sort((a, b) => b.lastTimestamp - a.lastTimestamp);

            clientsArray.forEach(item => {
                let cName = item.cName;
                let clientMsgs = item.messages;
                let lastMsg = item.lastMsg;
                
                // حساب عدد الرسائل غير المقروءة للعميل بناءً على رسائل الـ client التي توقيتها أكبر من آخر وقت تمت قراءتها فيه
                let lastSeen = clientLastSeenMap[cName] || 0;
                let unreadCount = clientMsgs.filter(m => m.sender === 'client' && m.timestamp > lastSeen).length;

                let cardDiv = document.createElement('div');
                cardDiv.classList.add('client-card');
                if (activeClientName === cName) cardDiv.classList.add('active');
                if (unreadCount > 0) cardDiv.classList.add('unread');

                cardDiv.innerHTML = `
                    <img src="https://i.pravatar.cc/150?img=${cName.length + 10}" alt="avatar">
                    <div class="client-card-info">
                        <h4>${cName} ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}</h4>
                        <p>${lastMsg.text}</p>
                    </div>
                `;
                cardDiv.onclick = (e) => openClientChat(cName, clientMsgs, e.currentTarget);
                clientsListEl.appendChild(cardDiv);
            });

            if (activeClientName && clientsMap[activeClientName]) {
                renderChatMessages(clientsMap[activeClientName]);
            }
        });

        window.openClientChat = function(cName, messages, element) {
            activeClientName = cName;
            
            // تحديث وقت آخر قراءة لرسائل العميل للوقت الحالي لتصفير العداد وتخزينه
            clientLastSeenMap[cName] = Date.now();
            localStorage.setItem('clientLastSeenMap', JSON.stringify(clientLastSeenMap));
            
            // إزالة حالة الـ unread والشارة من الكارد مباشرة
            if(element) {
                element.classList.remove('unread');
                let badge = element.querySelector('.unread-badge');
                if(badge) badge.remove();
            }

            document.getElementById('noChatScreen').style.display = 'none';
            document.getElementById('chatBoxContainer').style.display = 'flex';
            document.getElementById('currentChatClientName').innerText = cName;
            document.getElementById('currentChatAvatar').src = `https://i.pravatar.cc/150?img=${cName.length + 10}`;
            document.getElementById('chatSection').classList.add('show-screen');
            document.querySelectorAll('.client-card').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            renderChatMessages(messages);
        };

        window.goBackToClients = function() {
            document.getElementById('chatSection').classList.remove('show-screen');
            activeClientName = null;
        };

        function renderChatMessages(messages) {
            const chatBody = document.getElementById('chatMessagesBody');
            chatBody.innerHTML = '';
            messages.forEach(msg => {
                const wrapperDiv = document.createElement('div');
                wrapperDiv.classList.add('message-wrapper');
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message');
                const timeSpan = document.createElement('span');
                timeSpan.classList.add('msg-timestamp');
                timeSpan.innerText = formatTime(msg.timestamp);

                if (msg.sender === 'client') {
                    wrapperDiv.classList.add('client'); msgDiv.classList.add('client');
                    msgDiv.innerHTML = `<p>${msg.text}</p>`;
                } else {
                    wrapperDiv.classList.add('support'); msgDiv.classList.add('support');
                    msgDiv.innerHTML = `<p>${msg.text}</p>`;
                }
                wrapperDiv.appendChild(msgDiv); wrapperDiv.appendChild(timeSpan);
                chatBody.appendChild(wrapperDiv);
            });
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        window.sendSupportReply = function() {
            const input = document.getElementById('supportReplyInput');
            const text = input.value.trim();
            if (text === "" || !activeClientName) return;
            const now = new Date();
            push(chatsRef, {
                sender: 'support', clientName: activeClientName,
                text: text, timestamp: now.getTime(), dateString: now.toLocaleDateString('ar-EG'), timeString: formatTime(now.getTime())
            });
            input.value = "";
        };

        document.getElementById('supportReplyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendSupportReply();
        });
    </script>
</body>
</html>
