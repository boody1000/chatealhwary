        .clients-list { overflow-y: auto; flex: 1; }

        .client-card:hover, .client-card.active { background: #f0f2f5; }
        .client-card img { width: 50px; height: 50px; border-radius: 50%; margin-left: 15px; object-fit: cover; }
        .client-card-info { flex: 1; }
        .client-card-info h4 { font-size: 15px; color: #050505; display: flex; justify-content: space-between; align-items: center; }
        .client-card-info p { font-size: 13px; color: #65676b; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }

        .call-actions { display: flex; gap: 10px; }

        .message.client { background: #fff; color: #050505; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.support { background: #0084ff; color: #fff; }
        /* تقريب الرسائل المتتالية من نفس المرسل من بعض زي الماسنجر بالظبط */
        .message-wrapper.grouped-top .message { border-top-left-radius: 6px; border-top-right-radius: 6px; }

        @keyframes typingBlink { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        .chat-footer-input { padding: 15px 20px; background: #fff; border-top: 1px solid #e4e6eb; display: flex; align-items: center; gap: 15px; }
        .chat-footer-input input { flex: 1; padding: 12px 18px; background: #f0f2f5; border: none; border-radius: 25px; outline: none; font-size: 14px; }

            width: 65px; height: 65px; border-radius: 50%; border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;

        .m-btn-hangup { background: #e41e3f; }
        .m-btn-accept { background: #31a24c; }
        .m-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, off } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVZQ3DTRr_7c5q3CmPRzt3ai1KX80F0C0",
            authDomain: "marry-55604.firebaseapp.com",
            databaseURL: "https://marry-55604-default-rtdb.firebaseio.com",
            projectId: "marry-55604",
            storageBucket: "marry-55604.firebasestorage.app",
            messagingSenderId: "524067560260",
            appId: "1:524067560260:web:adc87a02eadf098d5a5511",
            measurementId: "G-0QW3CXTSM3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatsRootRef = ref(db, 'chats/');
        const DAILY_ROOM_URL = "https://alhwarychate.daily.co/idXtSiRYJM6tYNEfA1tn";

        // اسم آمن للاستخدام كمفتاح مسار في Firebase
        function safeKey(name) {
            return name ? name.replace(/[.#$\[\]\/\s]+/g, '_') : '';
        }

        let activeClientName = null;
        let activeClientOriginalName = null;
        let currentClientMessagesListener = null;
        let isInitialLoad = true;
        let knownMessagesKeys = new Set();
        let audioCtx = null;
        let isAudioUnlocked = false;
        let callObject = null;
        let isMuted = false;
        const ringAudio = document.getElementById('ringSound');
        let callStartTime = null;
        let mediaRecorder = null;
        let recordedAudioChunks = [];

        // مؤشر "بيكتب الآن..." - مراقبة حالة الكتابة للعميل الحالي
        let latestTypingData = {};
        function updateTypingIndicatorUI() {
            const indicator = document.getElementById('typingIndicatorWrapperEmp');
            if (!indicator || !activeClientOriginalName) return;
            const clientTyping = latestTypingData[safeKey(activeClientOriginalName)]?.client;
            const isRecentlyTyping = clientTyping && (Date.now() - clientTyping < 3000);
            const chatBody = document.getElementById('chatMessagesBody');
            if (isRecentlyTyping) {
                indicator.style.display = 'flex';
                chatBody.appendChild(indicator);
                chatBody.scrollTop = chatBody.scrollHeight;
            } else {
                indicator.style.display = 'none';
            }
        }
        const typingRootRef = ref(db, 'typing/');
        onValue(typingRootRef, (snapshot) => {
            latestTypingData = snapshot.val() || {};
            updateTypingIndicatorUI();
        });

        // حالة أونلاين/أوفلاين للعميل
        let latestPresenceData = {};
        function updatePresenceIndicatorUI() {
            const statusEl = document.getElementById('currentChatStatus');
            if (!statusEl || !activeClientOriginalName) return;
            const info = latestPresenceData[safeKey(activeClientOriginalName)];
            const isOnline = info && info.status === 'online';
            statusEl.classList.toggle('offline', !isOnline);
            statusEl.innerHTML = `<i class="fa-solid fa-circle" style="font-size: 8px;"></i> ${isOnline ? 'متصل الآن' : 'غير متصل'}`;
        }
        const presenceRootRef = ref(db, 'online_clients/');
        onValue(presenceRootRef, (snapshot) => {
            latestPresenceData = snapshot.val() || {};
            updatePresenceIndicatorUI();
        });

        let clientLastSeenMap = JSON.parse(localStorage.getItem('clientLastSeenMap') || '{}');

        const TELEGRAM_BOT_TOKEN = "8090373434:AAHrDcaMsXYG444KTUnXr1RXTEGvBXW_Fw4";
        const TELEGRAM_CHAT_ID = "7594072203";

        function sendTelegramNotification(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            }).catch(err => console.log("Telegram Error:", err));
        }

        function playStandardRingTone() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(440, now);
                osc2.frequency.setValueAtTime(480, now);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.setValueAtTime(0, now + 2.0);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 2.0);
                osc2.stop(now + 2.0);
            } catch(e) {}
        }

        let standardRingInterval = null;
        function startStandardRinging() {
            stopStandardRinging();
            playStandardRingTone();
            standardRingInterval = setInterval(() => {
                playStandardRingTone();
            }, 4000);
        }

        function stopStandardRinging() {
            if (standardRingInterval) {
                clearInterval(standardRingInterval);
                standardRingInterval = null;
            }
        }

        const ONESIGNAL_APP_ID = "9785b8da-85a0-43e5-95f6-4c272e9e96be";
        const ONESIGNAL_REST_API_KEY = "os_v2_app_s6c3rwufubb6lfpwjqts5huwx2toppfrzdseob53odgfmanozyvb4ju4xjrnymetg7spwxho7u2yjmg46kgk2qds5gkol72vjaxzyia";

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function (OneSignal) {
            await OneSignal.init({
                appId: ONESIGNAL_APP_ID,
                serviceWorkerPath: 'sw_2.js',
                notifyButton: { enable: false }
            });
        });

        function registerEmployeeForPush(employeeName) {
            if (!employeeName) return;
            OneSignalDeferred.push(async function (OneSignal) {
                try {
                    await OneSignal.Notifications.requestPermission();
                    await OneSignal.login(employeeName);
                    await OneSignal.User.addTag('role', 'employee');
                } catch (err) {
                    console.log('خطأ في تسجيل إشعارات OneSignal:', err);
                }
            });
        }

        async function sendPushToClient(clientName, title, body) {
            if (!clientName) return;
            try {
                await fetch('https://api.onesignal.com/notifications?c=push', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Key ' + ONESIGNAL_REST_API_KEY
                    },
                    body: JSON.stringify({
                        app_id: ONESIGNAL_APP_ID,
                        target_channel: 'push',
                        include_aliases: { external_id: [clientName] },
                        headings: { en: title },
                        contents: { en: body }
                    })
                });
            } catch (err) {
                console.log('خطأ في إرسال إشعار OneSignal:', err);
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw_2.js')
                    .then(reg => console.log('ServiceWorker registered:', reg.scope))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }

        function showPushNotification(title, body, options) {
            options = options || {};
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'SHOW_NOTIFICATION',
                    title: title,
                    body: body,
                    url: window.location.href,
                    tag: options.tag || 'message',
                    requireInteraction: !!options.requireInteraction
                });
            } else if (Notification.permission === 'granted') {
                try {
                    new Notification(title, {
                        body: body,
                        icon: './22.jpg',
                        badge: './22.jpg',
                        vibrate: [300, 100, 300, 100, 300],
                        tag: options.tag || 'message',
                        requireInteraction: !!options.requireInteraction
                    });
                } catch(e) {}
            }
        }

        const loggedUser = localStorage.getItem('loggedUsername') || localStorage.getItem('loggedAdmin');
        if (loggedUser) {
            document.getElementById('loggedEmployeeName').innerText = loggedUser;
        }

        function listenToAllCalls() {
            const callsRef = ref(db, 'calls/');
            onValue(callsRef, (snapshot) => {
                const callsData = snapshot.val();
                if (!callsData) {
                    closeCallScreenUI();
                    return;
                }
                
                let hasActiveIncomingCall = false;
                Object.keys(callsData).forEach(cName => {
                    let callObj = callsData[cName];
                    if (callObj.status === 'calling' && callObj.sender === 'client') {
                        hasActiveIncomingCall = true;
                        activeClientOriginalName = cName;
                        document.getElementById('callStatusText').innerText = `مكالمة واردة من: ${cName}`;
                        document.getElementById('messengerCallScreen').style.display = 'flex';
                        document.getElementById('messengerControlsBar').innerHTML = `
                            <button class="m-btn m-btn-accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
                            <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
                        `;
                        if (!standardRingInterval) {
                            startStandardRinging();
                            showPushNotification(`📞 مكالمة واردة من: ${cName}`, 'اضغط للرد على المكالمة', { tag: 'incoming-call', requireInteraction: true });
                        }
                        if (ringAudio && ringAudio.src && !ringAudio.src.endsWith(window.location.href) && ringAudio.paused) { 
                            ringAudio.currentTime = 0; 
                            ringAudio.play().catch(e=>{}); 
                        }
                    } else if (callObj.status === 'accepted' || callObj.status === 'ended') {
                        if (activeClientOriginalName === cName && callObj.status === 'ended') {
                            closeCallScreenUI();
                        } else if (callObj.status === 'accepted') {
                            stopStandardRinging();
                            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
                            if (document.getElementById('messengerCallScreen').style.display === 'flex' && callObj.sender !== loggedUser) {
                                document.getElementById('messengerCallScreen').style.display = 'none';
                            }
                        }
                    }
                });

                if (!hasActiveIncomingCall) {
                    closeCallScreenUI();
                }
            });
        }

        window.initiateCall = function() {
            if (!activeClientOriginalName) { alert("اختر عميلاً أولاً"); return; }
            callStartTime = Date.now();
            set(ref(db, 'calls/' + activeClientOriginalName), {
                sender: 'support',
                status: 'calling',
                timestamp: callStartTime
            });

            sendPushToClient(activeClientOriginalName, '📞 مكالمة واردة', 'خدمة العملاء بتتصل بيك الآن');

            document.getElementById('callStatusText').innerText = "جاري الاتصال الصوتي...";
            document.getElementById('messengerCallScreen').style.display = 'flex';
            document.getElementById('messengerControlsBar').innerHTML = `
                <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
            `;
            startStandardRinging();
            if (ringAudio && ringAudio.src && !ringAudio.src.endsWith(window.location.href)) { 
                ringAudio.currentTime = 0; 
                ringAudio.play().catch(e=>{}); 
            }

            startDailyAudioFrame();
        };

        window.acceptCall = function() {
            stopStandardRinging();
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            callStartTime = Date.now();
            if (activeClientOriginalName) {
                set(ref(db, 'calls/' + activeClientOriginalName), {
                    sender: loggedUser || 'support',
                    status: 'accepted',
                    timestamp: callStartTime
                });
            }

            document.getElementById('callStatusText').innerText = "المكالمة الصوتية جارية...";
            document.getElementById('messengerControlsBar').innerHTML = `
                <button class="m-btn m-btn-mute" id="muteBtn" onclick="toggleMute()"><i class="fa-solid fa-microphone"></i></button>
                <button class="m-btn m-btn-hangup" onclick="endCallCompletely()"><i class="fa-solid fa-phone-slash"></i></button>
            `;
            startDailyAudioFrame();
        };

        function startDailyAudioFrame() {
            if (!callObject) {
                callObject = window.DailyIframe.createCallObject({
                    audioSource: true,
                    videoSource: false
                });

                callObject.on('joined-meeting', () => {
                    console.log("تم الانضمام للمكالمة الصوتية بنجاح");
                    callObject.setLocalAudio(true);
                });

                callObject.on('track-started', (e) => {
                    if (e.track.kind === 'audio' && !e.participant.local) {
                        const audioEl = document.getElementById('remoteAudio');
                        if (audioEl) {
                            audioEl.srcObject = new MediaStream([e.track]);
                            audioEl.play().catch(err => console.log("خطأ في تشغيل الصوت:", err));
                            
                            try {
                                const localStream = callObject.participants().local?.audioStream || new MediaStream();
                                const combinedStream = new MediaStream([...localStream.getTracks(), ...e.track.clone().mediaStream.getTracks()]);
                                mediaRecorder = new MediaRecorder(combinedStream);
                                recordedAudioChunks = [];
                                mediaRecorder.ondataavailable = (event) => {
                                    if (event.data.size > 0) {
                                        recordedAudioChunks.push(event.data);
                                    }
                                };
                                mediaRecorder.onstop = () => {
                                    const audioBlob = new Blob(recordedAudioChunks, { type: 'audio/webm' });
                                    const reader = new FileReader();
                                    reader.onloadend = function() {
                                        const base64Audio = reader.result;
                                        const endTime = Date.now();
                                        const durationSeconds = callStartTime ? Math.floor((endTime - callStartTime) / 1000) : 0;
                                        
                                        push(ref(db, 'call_logs/'), {
                                            clientName: activeClientOriginalName,
                                            employeeName: loggedUser || 'موظف',
                                            startTime: callStartTime ? new Date(callStartTime).toLocaleString('ar-EG') : '',
                                            endTime: new Date(endTime).toLocaleString('ar-EG'),
                                            duration: durationSeconds + ' ثانية',
                                            audioData: base64Audio,
                                            timestamp: endTime
                                        });

                                        sendTelegramNotification(`📞 <b>تم تسجيل مكالمة جديدة</b>\n👤 العميل: ${activeClientOriginalName}\n👨‍💼 الموظف: ${loggedUser || 'موظف'}\n⏱️ المدة: ${durationSeconds} ثانية`);
                                    };
                                    reader.readAsDataURL(audioBlob);
                                };
                                mediaRecorder.start();
                            } catch (err) {
                                console.log("خطأ في بدء تسجيل المكالمة:", err);
                            }
                        }
                    }
                });
            }

            callObject.join({ url: DAILY_ROOM_URL }).catch(err => {
                console.error("خطأ في الانضمام للمكالمة الصوتية:", err);
            });
        }

        window.endCallCompletely = function() {
            stopStandardRinging();
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            } else if (activeClientOriginalName) {
                const endTime = Date.now();
                const durationSeconds = callStartTime ? Math.floor((endTime - callStartTime) / 1000) : 0;
                
                push(ref(db, 'call_logs/'), {
                    clientName: activeClientOriginalName,
                    employeeName: loggedUser || 'موظف',
                    startTime: callStartTime ? new Date(callStartTime).toLocaleString('ar-EG') : '',
                    endTime: new Date(endTime).toLocaleString('ar-EG'),
                    duration: durationSeconds + ' ثانية',
                    timestamp: endTime
                });

                sendTelegramNotification(`📞 <b>تم تسجيل مكالمة جديدة</b>\n👤 العميل: ${activeClientOriginalName}\n👨‍💼 الموظف: ${loggedUser || 'موظف'}\n⏱️ المدة: ${durationSeconds} ثانية`);
            }

            if (activeClientOriginalName) {
                set(ref(db, 'calls/' + activeClientOriginalName + '/status'), 'ended');
            }
            closeCallScreenUI();
        };

        function closeCallScreenUI() {
            stopStandardRinging();
            if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
            document.getElementById('messengerCallScreen').style.display = 'none';
            callStartTime = null;
            mediaRecorder = null;
            recordedAudioChunks = [];
            if (callObject) {
                callObject.leave();
            }
        }

        window.toggleMute = function() {
            if (!callObject) return;
            isMuted = !isMuted;
            callObject.setLocalAudio(!isMuted);
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('active', isMuted);
            btn.innerHTML = isMuted ? '<i class="fa-solid fa-microphone-slash"></i>' : '<i class="fa-solid fa-microphone"></i>';
        };

        window.enableAudioAndNotifications = function() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                isAudioUnlocked = true;
                if ('Notification' in window) {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            showPushNotification('تم تفعيل التنبيهات', 'ستصلك إشعارات الرسائل الجديدة على الموبايل والكمبيوتر');
                        }
                    });
                }
                document.getElementById('soundBanner').style.display = 'none';
                listenToAllCalls();
                registerEmployeeForPush(loggedUser);
            } catch (e) { alert("حدث خطأ"); }
        };

        function playNotificationSound() {
            if (!isAudioUnlocked || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12; hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        // الاستماع لجذر الـ chats لكشف جميع المحادثات وتحديث القائمة الجانبية بشكل صحيح ودقيق
        onValue(chatsRootRef, (snapshot) => {
            const allChatsData = snapshot.val();
            const clientsListEl = document.getElementById('clientsListContainer');
            clientsListEl.innerHTML = '';
            
            if (!allChatsData) {
                clientsListEl.innerHTML = '<p style="text-align:center; color:#8a8d91; padding:20px;">لا توجد محادثات حتى الآن</p>';
                isInitialLoad = false;
                return;
            }

            let clientsMap = {};
            
            // التعامل مع الهيكل الذي يرسل فيه العميل رسائله تحت كل مسار باسم العميل `chats/اسم_العميل`
            Object.keys(allChatsData).forEach(clientKey => {
                let clientMessagesObj = allChatsData[clientKey];
                if (clientMessagesObj && typeof clientMessagesObj === 'object') {
                    let messagesArray = [];
                    let realClientName = clientKey.replace(/_/g, ' '); // محاولة استعادة الاسم الأصلي
                    
                    Object.keys(clientMessagesObj).forEach(msgKey => {
                        let msg = clientMessagesObj[msgKey];
                        if (msg && typeof msg === 'object') {
                            if (msg.clientName) {
                                realClientName = msg.clientName;
                            }
                            messagesArray.push({
                                ...msg,
                                firebaseKey: msgKey
                            });
                        }
                    });

                    if (messagesArray.length > 0) {
                        messagesArray.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                        clientsMap[realClientName] = {
                            safeKeyName: clientKey,
                            messages: messagesArray,
                            lastMsg: messagesArray[messagesArray.length - 1],
                            lastTimestamp: messagesArray[messagesArray.length - 1].timestamp || 0
                        };
                    }
                }
            });

            let clientsArray = Object.keys(clientsMap).map(cName => {
                return {
                    cName: cName,
                    ...clientsMap[cName]
                };
            });

            clientsArray.sort((a, b) => b.lastTimestamp - a.lastTimestamp);

            let allKeysSet = new Set();
            clientsArray.forEach(item => {
                item.messages.forEach(m => allKeysSet.add(m.firebaseKey));
            });

            if (!isInitialLoad) {
                clientsArray.forEach(item => {
                    item.messages.forEach(newMsg => {
                        if (!knownMessagesKeys.has(newMsg.firebaseKey)) {
                            if (newMsg.sender === 'client') {
                                playNotificationSound();
                                sendTelegramNotification(`💬 <b>رسالة جديدة من عميل</b>\n👤 الاسم: ${item.cName}\n✉️ النص: ${newMsg.text}`);
                                showPushNotification(`رسالة جديدة من: ${item.cName}`, newMsg.text);
                            }
                        }
                    });
                });
            }
            knownMessagesKeys = allKeysSet;
            isInitialLoad = false;

            clientsArray.forEach(item => {
                let cName = item.cName;
                let clientMsgs = item.messages;
                let lastMsg = item.lastMsg;
                
                let lastSeen = clientLastSeenMap[cName] || 0;
                let unreadCount = clientMsgs.filter(m => m.sender === 'client' && (m.timestamp || 0) > lastSeen).length;

                let cardDiv = document.createElement('div');
                cardDiv.classList.add('client-card');
                if (activeClientOriginalName === cName) cardDiv.classList.add('active');
                if (unreadCount > 0) cardDiv.classList.add('unread');

                cardDiv.innerHTML = `
                    <img src="https://i.pravatar.cc/150?img=${cName.length + 10}" alt="avatar">
                    <div class="client-card-info">
                        <h4>${cName} ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}</h4>
                        <p>${lastMsg.text || ''}</p>
                    </div>
                `;
                cardDiv.onclick = (e) => openClientChat(cName, item.safeKeyName, clientMsgs, e.currentTarget);
                clientsListEl.appendChild(cardDiv);
            });

            if (activeClientOriginalName && clientsMap[activeClientOriginalName]) {
                renderChatMessages(clientsMap[activeClientOriginalName].messages);
            }
        });

        window.openClientChat = function(cName, safeKeyName, messages, element) {
            activeClientOriginalName = cName;
            activeClientName = safeKeyName;
            
            clientLastSeenMap[cName] = Date.now();
            localStorage.setItem('clientLastSeenMap', JSON.stringify(clientLastSeenMap));
            
            if(element) {
                element.classList.remove('unread');
                let badge = element.querySelector('.unread-badge');
                if(badge) badge.remove();
            }

            document.getElementById('noChatScreen').style.display = 'none';
            document.getElementById('chatBoxContainer').style.display = 'flex';
            document.getElementById('currentChatClientName').innerText = cName;
            document.getElementById('currentChatAvatar').src = `https://i.pravatar.cc/150?img=${cName.length + 10}`;
            document.getElementById('chatSection').classList.add('show-screen');
            document.querySelectorAll('.client-card').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            
            renderChatMessages(messages);
            updateTypingIndicatorUI();
            updatePresenceIndicatorUI();
        };

        window.goBackToClients = function() {
            document.getElementById('chatSection').classList.remove('show-screen');
            activeClientOriginalName = null;
            activeClientName = null;
        };

        function renderChatMessages(messages) {
            const chatBody = document.getElementById('chatMessagesBody');
            const typingIndicator = document.getElementById('typingIndicatorWrapperEmp');
            chatBody.innerHTML = '';

            messages.forEach((msg, index) => {
                const prevMsg = messages[index - 1];
                const nextMsg = messages[index + 1];
                const isFirstInGroup = !prevMsg || prevMsg.sender !== msg.sender;
                const isLastInGroup = !nextMsg || nextMsg.sender !== msg.sender;

                const wrapperDiv = document.createElement('div');
                wrapperDiv.classList.add('message-wrapper', msg.sender === 'client' ? 'client' : 'support');
                if (isFirstInGroup) wrapperDiv.classList.add('group-start');
                if (!isFirstInGroup) wrapperDiv.classList.add('grouped-top');
                if (!isLastInGroup) wrapperDiv.classList.add('grouped-bottom');

                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', msg.sender === 'client' ? 'client' : 'support');
                msgDiv.innerHTML = `<p>${msg.text}</p>`;

                // الوقت بيظهر بس تحت آخر رسالة في المجموعة المتتالية (زي الماسنجر بالظبط)
                let timeSpan = null;
                if (isLastInGroup) {
                    timeSpan = document.createElement('span');
                    timeSpan.classList.add('msg-timestamp');
                    timeSpan.innerText = formatTime(msg.timestamp);
                }

                if (msg.sender === 'client') {
                    const row = document.createElement('div');
                    row.classList.add('client-row');

                    const bubbleCol = document.createElement('div');
                    bubbleCol.classList.add('client-bubble-col');
                    bubbleCol.appendChild(msgDiv);
                    if (timeSpan) bubbleCol.appendChild(timeSpan);

                    const avatar = document.createElement('div');
                    avatar.classList.add('client-avatar');
                    if (isLastInGroup) {
                        avatar.innerText = (msg.clientName || activeClientName || '?').trim().charAt(0).toUpperCase();
                    } else {
                        avatar.classList.add('spacer');
                    }

                    row.appendChild(bubbleCol);
                    row.appendChild(avatar);
                    wrapperDiv.appendChild(row);
                } else {
                    wrapperDiv.appendChild(msgDiv);
                    if (timeSpan) wrapperDiv.appendChild(timeSpan);
                }

                chatBody.appendChild(wrapperDiv);
            });

            if (typingIndicator) chatBody.appendChild(typingIndicator);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        window.sendSupportReply = function() {
            const input = document.getElementById('supportReplyInput');
            const text = input.value.trim();
            if (text === "" || !activeClientOriginalName) return;
            const now = new Date();
            
            const clientChatRef = ref(db, 'chats/' + safeKey(activeClientOriginalName));
            push(clientChatRef, {
                sender: 'support', 
                clientName: activeClientOriginalName,
                text: text, 
                timestamp: now.getTime(), 
                dateString: now.toLocaleDateString('ar-EG'), 
                timeString: formatTime(now.getTime())
            });
            
            sendPushToClient(activeClientOriginalName, '💬 رسالة جديدة من خدمة العملاء', text);

            clearTimeout(supportTypingTimeout);
            set(ref(db, 'typing/' + safeKey(activeClientOriginalName) + '/support'), null);

            input.value = "";
        };

        let supportTypingTimeout = null;
        document.getElementById('supportReplyInput').addEventListener('input', function() {
            if (!activeClientOriginalName) return;
            const typingRef = ref(db, 'typing/' + safeKey(activeClientOriginalName) + '/support');
            set(typingRef, Date.now());
            clearTimeout(supportTypingTimeout);
            supportTypingTimeout = setTimeout(() => set(typingRef, null), 2000);
        });

        document.getElementById('supportReplyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendSupportReply();
        });
    </script>
</body>
</html>
