<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الموظف - شركة الهواري</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Daily.co Call Object SDK -->
    <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- القائمة الجانبية أو واجهة المحادثات -->
        <div class="w-1/3 border-r border-slate-800 p-4 flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-emerald-400">إدارة المحادثات</h2>
            <div id="clients-list" class="overflow-y-auto flex-1 space-y-2">
                <!-- يتم تعبئة العملاء هنا برمجياً -->
            </div>
        </div>

        <!-- منطقة المحادثة والاتصال -->
        <div class="w-2/3 flex flex-col justify-between p-6">
            <div id="chat-header" class="border-b border-slate-800 pb-4 flex justify-between items-center">
                <h3 id="current-client-name" class="text-lg font-semibold">اختر عميلاً لبدء المحادثة</h3>
                <!-- زر بدء المكالمة الصوتية -->
                <button id="start-call-btn" onclick="employeeStartCall()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg transition duration-200 flex items-center gap-2">
                    📞 بدء مكالمة صوتية
                </button>
            </div>

            <!-- شاشة الاتصال النشطة (تظهر أثناء المكالمة) -->
            <div id="call-screen" class="hidden flex flex-col items-center justify-center flex-1 bg-slate-800/50 rounded-xl p-6 my-4 border border-slate-700">
                <div class="animate-pulse text-emerald-400 text-lg font-bold mb-2">جاري المكالمة الصوتية...</div>
                <div id="call-timer" class="text-2xl font-mono mb-6">00:00</div>
                <button onclick="employeeEndCall()" class="bg-rose-600 hover:bg-rose-500 text-white px-6 py-2 rounded-full font-semibold transition duration-200">
                    إنهاء المكالمة ❌
                </button>
            </div>

            <!-- رسائل الشات -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

            <!-- صندوق إدخال الرسالة -->
            <div class="flex gap-2 pt-4 border-t border-slate-800">
                <input type="text" id="message-input" placeholder="اكتب رسالتك للموظف..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500">
                <button onclick="sendEmployeeMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg font-semibold transition">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForAppStructure",
            authDomain: "alhwarychate.firebaseapp.com",
            databaseURL: "https://alhwarychate-default-rtdb.firebaseio.com",
            projectId: "alhwarychate",
            storageBucket: "alhwarychate.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;

        window.activeClientKey = null;
        window.isEmpCallActiveOrRinging = false;
        window.callFrame = null;
        window.activeCallRoomUrl = "";
        let timerInterval = null;

        // دالة بدء المكالمة للموظف (مع التحديث البرمجي لإنشاء الغرفة تلقائياً)
        window.employeeStartCall = async function() {
            if (!window.activeClientKey || window.isEmpCallActiveOrRinging) return;
            window.isEmpCallActiveOrRinging = true;
            showEmployeeCallScreen();

            try {
                // إنشاء غرفة صوتية جديدة عبر Daily API وتجاوز مشكلة 404
                const response = await fetch('https://api.daily.co/v1/rooms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer 0c2d7732a3d0774681fb789ff945b0a88ef3d386927dca4740e256b82c5a0895'
                    },
                    body: JSON.stringify({
                        properties: { exp: Math.floor(Date.now() / 1000) + 3600 }
                    })
                });
                
                const roomData = await response.json();
                if (!roomData.url) throw new Error("فشل إنشاء الغرفة");
                
                window.activeCallRoomUrl = roomData.url;

                // إرسال تفاصيل الغرفة للعميل عبر فايربيس
                await set(ref(db, `single_chat_room/${window.activeClientKey}/call`), {
                    roomUrl: window.activeCallRoomUrl,
                    type: 'offer',
                    sender: 'employee'
                });

                window.callFrame = DailyIframe.createCallObject({ audioSource: true, videoSource: false });
                await window.callFrame.join({ url: window.activeCallRoomUrl });
                startEmpTimer();
            } catch(e) {
                console.error("Daily start error:", e);
                alert("تعذر بدء المكالمة");
                employeeEndCall();
            }
        };

        window.employeeEndCall = async function() {
            window.isEmpCallActiveOrRinging = false;
            if (window.callFrame) {
                await window.callFrame.destroy();
                window.callFrame = null;
            }
            if (window.activeClientKey) {
                await set(ref(db, `single_chat_room/${window.activeClientKey}/call`), null);
            }
            hideEmployeeCallScreen();
            stopEmpTimer();
        };

        function showEmployeeCallScreen() {
            document.getElementById('call-screen').classList.remove('hidden');
            document.getElementById('start-call-btn').classList.add('hidden');
        }

        function hideEmployeeCallScreen() {
            document.getElementById('call-screen').classList.add('hidden');
            document.getElementById('start-call-btn').classList.remove('hidden');
        }

        function startEmpTimer() {
            let seconds = 0;
            const timerEl = document.getElementById('call-timer');
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopEmpTimer() {
            clearInterval(timerInterval);
            document.getElementById('call-timer').textContent = "00:00";
        }
    </script>
</body>
</html>
